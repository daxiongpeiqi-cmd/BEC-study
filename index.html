// Walk dayPlan and auto-sync wordStates based on doneDays / review appearances
function syncWordStates(){
  const ws = state.wordStates || (state.wordStates = {});
  for (let d=1; d<=TOTAL_DAYS; d++){
    const t = dayPlan[d].tasks; if (!t) continue;
    if (state.doneDays.includes(d)){
      (t.newWords||[]).forEach(w => { const k=(w.en||"").toLowerCase(); if(k) ws[k]="new"; });
      (t.reviewWords||[]).forEach(w => { const k=(w.en||"").toLowerCase(); if(k) ws[k]="reviewed"; });
    }
  }
}
function toggleWordState(en){
  const k = en.toLowerCase();
  const cur = state.wordStates[k] || "";
  const next = cur==="" ? "new" : (cur==="new" ? "reviewed" : "");
  if (next) state.wordStates[k] = next; else delete state.wordStates[k];
  saveState();
}
function saveState(){
  // 1) always write local cache
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){}
  // 2) debounced cloud upsert
  scheduleCloudSync();
}

/* ====== CloudBase PostgreSQL (PostgREST) sync layer ====== */
const CONFIG = {
  ENV: "becstudy-d3gee4lro8918b933",
  REST_BASE: "https://becstudy-d3gee4lro8918b933.api.tcloudbasegateway.com/v1/rdb/rest/",
  TABLE: "user_progress"
};
const NICK_KEY = "bec90_nickname";
let cbApp = null, cbToken = null, cbNick = null, cbReady = false;
let cbSyncTimer = null;
function setSyncStatus(mode){
  const el = document.getElementById("syncDot");
  if (!el) return;
  const map = {
    loading: {c:"#F59E0B", t:"正在连接云同步…"},
    cloud:   {c:"#10B981", t:"已同步云端"},
    local:   {c:"#94A3B8", t:"离线本地模式"}
  };
  const m = map[mode] || map.local;
  el.style.background = m.c;
  el.title = m.t;
}
function authHeaders(){
  const h = { "Content-Type": "application/json" };
  if (cbToken) h["Authorization"] = "Bearer " + cbToken;
  return h;
}
function scheduleCloudSync(){
  if (!cbReady || !cbToken || !cbNick) return;
  if (cbSyncTimer) clearTimeout(cbSyncTimer);
  cbSyncTimer = setTimeout(doCloudUpsert, 800);
}
async function doCloudUpsert(){
  if (!cbReady || !cbToken || !cbNick) return;
  try {
    const url = CONFIG.REST_BASE + CONFIG.TABLE + "?user_id=eq." + encodeURIComponent(cbNick);
    // Try POST with upsert preference first
    const r = await fetch(CONFIG.REST_BASE + CONFIG.TABLE, {
      method: "POST",
      headers: { ...authHeaders(), "Prefer": "resolution=merge-duplicates,return=minimal" },
      body: JSON.stringify({ user_id: cbNick, progress_data: state })
    });
    if (r.ok) { setSyncStatus("cloud"); return; }
    // fallback: GET then PATCH/POST
    const g = await fetch(url, { headers: authHeaders() });
    if (!g.ok) throw new Error("GET failed");
    const arr = await g.json();
    if (Array.isArray(arr) && arr.length){
      await fetch(url, { method: "PATCH", headers: authHeaders(), body: JSON.stringify({ progress_data: state }) });
    } else {
      await fetch(CONFIG.REST_BASE + CONFIG.TABLE, { method: "POST", headers: authHeaders(), body: JSON.stringify({ user_id: cbNick, progress_data: state }) });
    }
    setSyncStatus("cloud");
  } catch(e){
    console.warn("cloud upsert failed, keep local", e);
    setSyncStatus("local");
  }
}
async function initCloud(){
  if (typeof tcb === "undefined"){ setSyncStatus("local"); return; }
  try {
    setSyncStatus("loading");
    cbApp = tcb.init({ env: CONFIG.ENV });
    const auth = cbApp.auth();
    await auth.signInAnonymously();
    // get access token
    try {
      const tk = await auth.getAccessToken();
      cbToken = (tk && (tk.access_token || tk.accessToken)) || (tk && typeof tk === "string" ? tk : null);
    } catch(e){
      // fallback: read from saved auth state
      try { cbToken = (await auth.getLoginState()).access_token; } catch(e2){}
    }
    if (!cbToken) throw new Error("no access token");
    // GET progress
    const url = CONFIG.REST_BASE + CONFIG.TABLE + "?user_id=eq." + encodeURIComponent(cbNick) + "&select=progress_data";
    const r = await fetch(url, { headers: authHeaders() });
    if (r.ok){
      const arr = await r.json();
      if (Array.isArray(arr) && arr.length && arr[0].progress_data){
        const cloud = typeof arr[0].progress_data === "string" ? JSON.parse(arr[0].progress_data) : arr[0].progress_data;
        state = {
          doneDays: cloud.doneDays||[], remindTime: cloud.remindTime||"20:00",
          wrongWords: cloud.wrongWords||{}, wrongQuestions: cloud.wrongQuestions||[],
          acceptance: cloud.acceptance||{}, wordbook: cloud.wordbook||[],
          wordStates: cloud.wordStates||{}
        };
        try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){}
      }
    }
    cbReady = true;
    setSyncStatus("cloud");
    selectedDay = progressDay();
    renderAll();
  } catch(e){
    console.warn("cloud init failed, fallback to localStorage", e);
    cbReady = false; cbToken = null;
    setSyncStatus("local");
  }
}

const LOOKUP = {};
DATA.forEach(p => p.chapters.forEach(c => c.words.forEach(w => { LOOKUP[w.en.toLowerCase()] = w; })));
["phase1","phase2","phase3"].forEach(k => EXTRA_WORDS[k].forEach(t => {

}));

let popupEl = null;
function closePopup(){ if (popupEl){ popupEl.remove(); popupEl = null; } }
// Robust word extraction at click point
function extractWordAt(x, y){
  let r = null;
  if (document.caretRangeFromPoint) r = document.caretRangeFromPoint(x, y);
  if (!r) return "";
  let node = r.startContainer, off = r.startOffset;
  // If node is an element, drill into childNodes to find the text node at offset
  if (node.nodeType !== 3){
    // walk children to find text node
    const walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT, null);
    let n; while ((n = walker.nextNode())){
      // crude: if click position falls within this text, use it
      const range = document.createRange();
      range.selectNode(n);
      const rects = range.getClientRects();
      for (const rc of rects){
        if (x >= rc.left && x <= rc.right){ node = n; off = Math.max(0, Math.min(n.textContent.length, Math.floor((x-rc.left)/rc.width*n.textContent.length))); break; }
      }
      if (node === n) break;
    }
  }
  if (node.nodeType !== 3) return "";
  const text = node.textContent;
  let s = off, en = off;
  while (s > 0 && /[A-Za-z'-]/.test(text[s-1])) s--;
  while (en < text.length && /[A-Za-z'-]/.test(text[en])) en++;
  return text.slice(s, en).replace(/^['-]+|['-]+$/g, "");
}
document.addEventListener("click", (e) => {
  // Exclude interactive elements
  if (e.target.closest(".lookup-popup") || e.target.closest("button") || e.target.closest("a")
      || e.target.closest("input") || e.target.closest("select") || e.target.closest("textarea")
      || e.target.closest(".quiz-opt") || e.target.closest(".r-opt") || e.target.closest(".tab-btn")
      || e.target.closest(".cal-cell") || e.target.closest(".modal-overlay") || e.target.closest(".speak-btn")
      || e.target.closest(".accept-opt") || e.target.closest("audio")) return;
  const word = extractWordAt(e.clientX, e.clientY);
  if (!word || word.length < 2 || STOPWORDS.has(word.toLowerCase())) { closePopup(); return; }
  e.preventDefault();
  showPopup(word, e.clientX, e.clientY);
});
function showPopup(word, x, y){
  closePopup();
  popupEl = document.createElement("div");
  popupEl.className = "lookup-popup";
  const hit = LOOKUP[word.toLowerCase()];
  const phon = PHONETICS[word.toLowerCase()] || "";
  let html = '<div class="lp-word">'+esc(word)+(phon?'<span class="lp-phon">'+phon+'</span>':'')+'</div>';
  if (hit) {
    html += '<span class="lp-pos">'+esc(hit.pos||"")+'</span>';
    html += '<div class="lp-cn">'+esc(hit.cn||"")+'</div>';
  } else {
    html += '<div class="lp-cn" id="lpCn">⏳ 查询中…</div>';
  }
  html += '<div class="lp-actions"><button class="lp-save" onclick="saveToWordbook(\''+word.replace(/'/g,"\\'")+'\')">⭐ 加入单词本</button>'
    + '<button class="lp-close" onclick="closePopup()">关闭</button></div>';
  popupEl.innerHTML = html;
  document.body.appendChild(popupEl);
  // Measure and position with edge avoidance
  const w = popupEl.offsetWidth, h = popupEl.offsetHeight;
  const vw = window.innerWidth, vh = window.innerHeight;
  let left = x + 12, top = y + 14, arrow = "arrow-top";
  if (left + w > vw - 10) { left = x - w - 12; arrow = "arrow-left"; }
  if (top + h > vh - 10) { top = y - h - 14; arrow = "arrow-bottom"; }
  if (top < 10) top = 10;
  if (left < 10) left = 10;
  popupEl.style.left = left + "px";
  popupEl.style.top = top + "px";
  popupEl.classList.add(arrow);
  // Online dictionary fallback if not in local bank
  if (!hit){
    fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(word)+"&langpair=en|zh-CN")
      .then(r => r.json())
      .then(d => {
        const cn = d && d.responseData && d.responseData.translatedText;
        const cnEl = document.getElementById("lpCn");
        if (cnEl) cnEl.textContent = cn ? cn : "（未收录）";
        if (cn && !LOOKUP[word.toLowerCase()]){
          LOOKUP[word.toLowerCase()] = { en:word, pos:"", cn:cn };
        }
      })
      .catch(() => {
        const cnEl = document.getElementById("lpCn");
        if (cnEl) cnEl.textContent = "网络查询失败，请稍后再试";
      });
  }
}
function saveToWordbook(word){
  if (!state.wordbook) state.wordbook = [];
  if (!state.wordbook.find(w => w.en === word)) {
    const hit = LOOKUP[word];
    state.wordbook.push({ en:word, pos:hit?hit.pos:"", cn:hit?hit.cn:"未收录" });
    saveState();
    showToast("已加入单词本");
  } else showToast("已在单词本中");
  closePopup();
  renderAll();
}
function removeFromWordbook(en){
  state.wordbook = state.wordbook.filter(w => w.en !== en);
  saveState();
  renderAll();
}

/* ====== Quiz generator: 15-20 questions, 4 types ====== */
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function buildQuiz(plan){
  const t = plan.tasks;
  // word pool
  let wordPool = [];
  if (t.type === "phase1") wordPool = [...t.newWords, ...t.reviewWords];
  else wordPool = [...t.chapter.words];
  // also include wrong words from state
  Object.keys(state.wrongWords).forEach(w => {
    if (!wordPool.find(x => x.en === w)) wordPool.push({ en:w, pos:state.wrongWords[w].pos, cn:state.wrongWords[w].cn });
  });
  // sentence pool
  let sentPool = [];
  if (t.type === "phase1") sentPool = t.practiceSentences;
  else sentPool = t.chapter.sentences;

  const questions = [];
  const usedWords = new Set();

  // Type 1: 词性选择 (for each word)
  wordPool.slice(0, 10).forEach(w => {
    if (usedWords.has(w.en)) return;
    usedWords.add(w.en);
    const posOpts = shuffle([w.pos, ...shuffle(allWords.filter(x => x.pos !== w.pos).map(x => x.pos)).slice(0,3)]);
    questions.push({ type:1, label:"词性选择", q:'<b>'+esc(w.en)+'</b>（'+esc(w.cn)+'）的正确词性是？', opts:posOpts, a:w.pos, word:w.en });
  });
  // Type 2: 词义匹配 (for each word)
  wordPool.slice(0, 10).forEach(w => {
    const cnOpts = shuffle([w.cn, ...shuffle(allWords.filter(x => x.cn !== w.cn).map(x => x.cn)).slice(0,3)]);
    questions.push({ type:2, label:"词义匹配", q:'<b>'+esc(w.en)+'</b>'+'（'+esc(w.pos)+'）的中文释义是？', opts:cnOpts, a:w.cn, word:w.en });
  });
  // Type 3: 商务场景填空 (from sentences)
  sentPool.slice(0, 6).forEach((s, idx) => {
    // find a word in pool that appears in sentence
    const found = wordPool.find(w => s.en.toLowerCase().includes(w.en.toLowerCase()));
    let blanked, correct;
    if (found) {
      blanked = s.en.replace(new RegExp(found.en, 'i'), "______");
      correct = found.en;
    } else {
      // use a random word from pool
      correct = wordPool[idx % wordPool.length].en;
      blanked = s.en.replace(/\w+/, "______");
    }
    const optWords = shuffle([correct, ...shuffle(wordPool.filter(w => w.en !== correct).map(w => w.en)).slice(0,3)]);
    questions.push({ type:3, label:"场景填空", q:'<b>填空：</b>'+esc(blanked)+'<br><span style="font-size:.8rem;color:#64748b;">'+esc(s.cn)+'</span>', opts:optWords, a:correct, word:correct });
  });
  // Type 4: 短句汉译英 (pick correct English from Chinese)
  sentPool.slice(0, 6).forEach(s => {
    const enOpts = shuffle([s.en, ...shuffle(allSents.filter(x => x.en !== s.en).map(x => x.en)).slice(0,3)]);
    questions.push({ type:4, label:"汉译英", q:'<b>中文：</b>'+esc(s.cn)+'<br>请选出对应的英文句子：', opts:enOpts, a:s.en });
  });

  return questions;
}

  const questions = buildQuiz(plan);
  let html = '<div class="sec-title">'+SVG.pencil+' 随堂练习 <span class="sec-sub">共 '+questions.length+' 题 · 四类题型混合 · 全部围绕当天所学</span></div>';

function bindQuiz(plan){
  const questions = buildQuiz(plan);
  const selections = {};
  document.querySelectorAll('.quiz-opt').forEach(opt => {
    opt.onclick = () => {
      const qi = opt.dataset.q;
      document.querySelectorAll('.quiz-opt[data-q="'+qi+'"]').forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
      selections[qi] = opt.dataset.letter;
    };
  });
  const submit = document.getElementById("quizSubmit");
  if (submit) submit.onclick = () => {
    let correct = 0;
    const wrong = [];
    questions.forEach((q, qi) => {
      const chosen = selections[qi];
      const correctLetter = String.fromCharCode(65 + q.opts.indexOf(q.a));
      const qEl = document.querySelector('.quiz-q[data-q="'+qi+'"]');
      qEl.querySelectorAll('.quiz-opt').forEach(o => {
        o.classList.remove('selected');
        if (o.dataset.letter === correctLetter) o.classList.add('correct');
        if (o.dataset.letter === chosen && chosen !== correctLetter) o.classList.add('wrong');
      });
      // Bilingual explanation block
      let exCn = "";
      let point = "";
      if (q.type === 1) { exCn = "选择 " + q.word + "（" + q.a + "）的正确词性。"; point = "考点：词性辨析（" + q.word + " 是 " + q.a + "）"; }
      else if (q.type === 2) { exCn = "选择 " + q.word + " 的正确中文释义。"; point = "考点：商务词汇释义（" + q.word + " = " + q.a + "）"; }
      else if (q.type === 3) { exCn = "根据商务语境选择最合适的词填空。"; point = "考点：商务搭配（正确词为 " + q.a + "）"; }
      else if (q.type === 4) { exCn = "根据中文选出对应的英文原句。"; point = "考点：英汉互译（正确句已标绿）"; }
      const passed = (chosen === correctLetter);
      const exHtml = '<div style="margin-top:.5rem; padding:.6rem .8rem; border-radius:8px; font-size:.78rem; '
        + (passed ? 'background:#f0fdf4; color:#166534;' : 'background:#fef2f2; color:#991b1b;') + '">'
        + '<b>' + (passed ? '✅ 正确' : '❌ 错误') + '</b>　|　<b>中文题意：</b>' + exCn
        + '<br><b>正确答案：</b>' + correctLetter + '. ' + esc(q.a)
        + '<br><b>考点：</b>' + point + '</div>';
      qEl.insertAdjacentHTML("beforeend", exHtml);
      if (passed) correct++;
      else {
        wrong.push(q);
        if (q.word) state.wrongWords[q.word] = { pos:q.pos||"", cn:q.cn||"" };
        logWrongQuestion({ qType:q.label, word:q.word||"", qText:q.q.replace(/<[^>]+>/g,""), answer:q.a });
      }
    });
    saveState();
    const scoreEl = document.getElementById("quizScore");
    scoreEl.style.display = "block";
    scoreEl.textContent = "得分：" + correct + " / " + questions.length + "　正确率 " + Math.round(correct/questions.length*100) + "%";
    if (wrong.length) scoreEl.textContent += "　｜　" + wrong.length + " 个错题已自动加入复习列表";
    submit.disabled = true;
    submit.textContent = "已提交（错题已保存，详见下方解析）";
    window.scrollTo({ top: document.getElementById("quizBlock").offsetTop - 100, behavior:"smooth" });
  };
}

/* ====== Wrong question book ====== */
function logWrongQuestion(entry){
  // entry: {qType, word, qText, answer}
  const existing = state.wrongQuestions.find(x => x.qText === entry.qText && !x.mastered);
  if (existing) { existing.count++; existing.lastWrong = Date.now(); }
  else state.wrongQuestions.push({ ...entry, count:1, lastWrong:Date.now(), mastered:false });
  saveState();
}

/* ====== Word acceptance test (mandatory) ====== */
function getTodayWordPool(plan){
  const t = plan.tasks;
  let pool = [];
  if (t.type === "phase1") pool = [...t.newWords, ...t.reviewWords];
  else pool = [...(t.newWords||[]), ...(t.reviewWords||[]), ...t.chapter.words];
  Object.keys(state.wrongWords).forEach(w => {
    if (!pool.find(x => x.en === w)) pool.push({ en:w, pos:state.wrongWords[w].pos, cn:state.wrongWords[w].cn });
  });
  return pool;
}
function renderAcceptance(plan){
  const pool = getTodayWordPool(plan);
  const testWords = shuffle(pool).slice(0, Math.min(6, pool.length));
  let html = '<div class="sec-title">'+SVG.check+' 单词验收（强制环节）<span class="sec-sub">正确率 ≥ 80% 才能打卡</span></div>';
  html += '<div class="accept-block" id="acceptBlock">';
  html += '<div style="font-size:.85rem; color:#92400e; margin-bottom:.6rem;">随机抽 '+testWords.length+' 个当天词，3 类题型混合。未通过的词自动加入明天复习队列。</div>';
  testWords.forEach((w, i) => {
    const type = i % 3; // 0=en→cn, 1=cn→en input, 2=collocation
    html += '<div class="quiz-q" style="background:#fff;">';
    if (type === 0) {
      const opts = shuffle([w.cn, ...shuffle(allWords.filter(x=>x.cn!==w.cn).map(x=>x.cn)).slice(0,3)]);
      html += '<span class="q-type t2">英→中</span>';
      html += '<div class="q-text">'+(i+1)+'. <b>'+esc(w.en)+'</b> 的中文释义是？</div>';
      html += '<div class="quiz-opts" data-accept="'+i+'" data-type="mc" data-answer="'+esc(w.cn)+'">';
      opts.forEach((o, oi) => { const letter=String.fromCharCode(65+oi); html += '<div class="quiz-opt" data-letter="'+letter+'">'+letter+'. '+esc(o)+'</div>'; });
      html += '</div>';
    } else if (type === 1) {
      html += '<span class="q-type t1">中→英拼写</span>';
      html += '<div class="q-text">'+(i+1)+'. 请拼写中文「<b>'+esc(w.cn)+'</b>」对应的英文单词（'+esc(w.pos)+'）：</div>';
      html += '<input class="accept-input" data-accept="'+i+'" data-type="input" data-answer="'+esc(w.en)+'" placeholder="输入英文单词">';
    } else {
      html += '<span class="q-type t3">搭配选择</span>';
      const opts = shuffle([w.en, ...shuffle(allWords.filter(x=>x.en!==w.en).map(x=>x.en)).slice(0,3)]);
      html += '<div class="q-text">'+(i+1)+'. 哪个词与「<b>'+esc(w.cn)+'</b>」对应？</div>';
      html += '<div class="quiz-opts" data-accept="'+i+'" data-type="mc" data-answer="'+esc(w.en)+'">';
      opts.forEach((o, oi) => { const letter=String.fromCharCode(65+oi); html += '<div class="quiz-opt" data-letter="'+letter+'">'+letter+'. '+esc(o)+'</div>'; });
      html += '</div>';
    }
    html += '</div>';
  });
  html += '<button class="quiz-submit" id="acceptSubmit">提交验收</button>';
  html += '<div class="accept-status" id="acceptStatus" style="display:none;"></div>';
  html += '</div>';
  return html;
}
function bindAcceptance(plan){
  const block = document.getElementById("acceptBlock");
  if (!block) return;
  const selections = {};
  block.querySelectorAll('.quiz-opt[data-accept]').forEach(opt => {
    opt.onclick = () => {
      const qi = opt.dataset.accept;
      block.querySelectorAll('.quiz-opt[data-accept="'+qi+'"]').forEach(o => o.classList.remove('selected'));
      opt.classList.add("selected");
      selections[qi] = opt.textContent.replace(/^[A-D]\.\s*/,"");
    };
  });
  document.getElementById("acceptSubmit").onclick = () => {
    let correct = 0, total = 0;
    const failedWords = [];
    block.querySelectorAll('[data-accept]').forEach(el => {
      total++;
      const qi = el.dataset.accept;
      const ans = el.dataset.answer;
      if (el.dataset.type === "mc") {
        if (selections[qi] === ans) correct++;
        else failedWords.push(ans);
      } else if (el.dataset.type === "input") {
        const val = el.value.trim().toLowerCase();
        if (val === ans.toLowerCase()) correct++;
        else failedWords.push(ans);
      }
    });
    const pct = Math.round(correct/total*100);
    const status = document.getElementById("acceptStatus");
    status.style.display = "block";
    if (pct >= 80) {
      status.className = "accept-status pass";
      status.textContent = "✅ 验收通过！正确率 "+pct+"%（"+correct+"/"+total+"），可以打卡了。";
      state.acceptance[plan.day] = true;
      saveState();
    } else {
      status.className = "accept-status fail";
      status.textContent = "❌ 未通过（正确率 "+pct+"%，需 ≥80%）。错题已自动加入明天复习队列，请重新学习后再试。";
      // add failed words to wrongWords (auto-review queue)
      failedWords.forEach(w => {
        const found = getTodayWordPool(plan).find(x => x.en === w);
        if (found) state.wrongWords[w] = { pos:found.pos, cn:found.cn };
      });
      state.acceptance[plan.day] = false;
      saveState();
    }
    renderAll();
  };
}

function allDone(){ return state.doneDays.length >= TOTAL_DAYS; }
function taskItem(icon, txt){ return '<div class="task-item"><span class="ti-icon">'+icon+'</span><span>'+txt+'</span></div>'; }
function wordList(words, tag){
  if (!words.length) return '<div class="sent-item"><div class="sent-cn">本日无</div></div>';
  let h='<div class="word-list">';
  words.forEach(w => {
    const phon = PHONETICS[w.en.toLowerCase()] || "";
    // find an example sentence containing this word
    let exEn = "", exCn = "";
    for (const p of DATA) for (const c of p.chapters) for (const s of c.sentences){
      if (s.en.toLowerCase().includes(w.en.toLowerCase())) { exEn = s.en; exCn = s.cn; break; }
    }
    if (!exEn) { exEn = "In business, we often use '"+w.en+"' in professional contexts."; exCn = "在商务语境中，我们常用「"+w.cn+"」。"; }
    h += '<div class="word-item"><div class="word-row">'
      + '<button class="speak-btn" onclick="speak(\''+w.en.replace(/'/g,"\\'")+'\')" title="朗读">🔊</button>'
      + '<span class="word-en">'+esc(w.en)+'</span>'
      + (phon?'<span class="phon">'+phon+'</span>':'')
      + '<span class="word-pos">'+esc(w.pos)+'</span>'
      + '<span class="word-cn">'+esc(w.cn)+'</span>'
      + (tag==="new"?'<span class="word-tag new">新</span>':tag==="review"?'<span class="word-tag review">复</span>':"")
      + '</div>'
      + '<div class="word-example">'+esc(exEn)+'</div>'
      + '<div class="word-example-cn">'+esc(exCn)+'</div>'
      + '</div>';
  });
  return h+"</div>";
}
function sentList(sents){

function bindCalendar(){
  const wrap = document.getElementById("calMonths");
  if (!wrap) return;
  // rebuild calendar into existing container (we put placeholder in renderDay; rebuild now)
  const months = {};
  for (let d=1; d<=TOTAL_DAYS; d++){
    const dt = dayToDate(d);
    const key = dt.getFullYear()+"-"+dt.getMonth();
    if (!months[key]) months[key] = { year:dt.getFullYear(), month:dt.getMonth()+1, days:[] };
    months[key].days.push({ day:d, date:dt });
  }
  let html = "";
  Object.values(months).forEach(m => {
    html += '<div class="cal-month"><div class="m-title">'+m.year+"年"+m.month+"月</div>";
    html += '<div class="m-legend"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div class="cal-grid">';
    const lead = (m.days[0].date.getDay()+6)%7;
    for (let i=0;i<lead;i++) html += '<div class="cal-cell empty"></div>';
    m.days.forEach(({day,date}) => {
      let cls = "cal-cell has";
      if (state.doneDays.includes(day)) cls += " done";
      if (day === progressDay()) cls += " current";
      if (isToday(day)) cls += " today-cal";
      html += '<div class="'+cls+'" data-day="'+day+'">'+date.getDate()+"</div>";
    });
    html += "</div></div>";
  });
  wrap.innerHTML = html;
  wrap.querySelectorAll(".cal-cell.has").forEach(cell => {
    cell.onclick = () => { viewMode="day"; selectedDay = parseInt(cell.dataset.day); renderAll(); };
  });
  // collapsible toggle
  const toggle = document.getElementById("calToggle");
  if (toggle){
    toggle.onclick = () => {
      const months = document.getElementById("calMonths");
      const arrow = document.getElementById("calToggleArrow");

/* ====== Full Word Table (90-day master list) ====== */
let wtFilter = { q:"", phase:0 };
function buildMasterWords(){
  // Walk dayPlan, dedupe by en_lower; then merge custom wordbook; sort A-Z by English
  const seen = {};
  const out = [];
  for (let d=1; d<=TOTAL_DAYS; d++){
    try {
      const t = dayPlan[d].tasks; if (!t) continue;
      const list = [...(t.newWords||[]), ...(t.reviewWords||[])];
      list.forEach(w => {
        if (!w || !w.en) return;
        const k = String(w.en).toLowerCase();
        if (seen[k]) { seen[k].firstDay = Math.min(seen[k].firstDay, d); return; }
        seen[k] = { en:w.en, pos:w.pos||"", cn:w.cn||"", firstDay:d, phase:phaseOf(d), custom:false };
        out.push(seen[k]);
      });
    } catch(e){ console.warn("dayPlan walk err", d, e); }
  }
  // merge custom wordbook entries (defensive against malformed entries)
  try {
    (state.wordbook||[]).forEach(w => {
      if (!w || !w.en) return;
      const k = String(w.en).toLowerCase();
      if (seen[k]) { seen[k].custom = true; return; }
      seen[k] = { en:w.en, pos:w.pos||"", cn:w.cn||"", firstDay:null, phase:0, custom:true };
      out.push(seen[k]);
    });
  } catch(e){ console.warn("wordbook merge err", e); }
  out.sort((a,b) => String(a.en).localeCompare(String(b.en)));
  return out;
}
function renderWordTable(){
  syncWordStates(); saveState();
  const area = document.getElementById("mainArea");
  document.getElementById("checkinRow").style.display = "none";
  const all = buildMasterWords();
  const ws = state.wordStates || {};
  const done = all.filter(w => (ws[w.en.toLowerCase()]==="new"||ws[w.en.toLowerCase()]==="reviewed")).length;
  const customCount = (state.wordbook||[]).length;
  const sysCount = all.length - customCount;

  let html = '<div class="day-banner"><div class="db-left"><h2>📖 单词表</h2>'
    + '<div class="meta">系统词 + 自定义生词 已合并 ｜ 共 '+all.length+' 词（系统 '+sysCount+' + ⭐自定义 '+customCount+'）｜ 已掌握 '+done+' 词</div></div>'
    + '<span class="day-badge">A-Z 排序 · 点击词切换状态</span></div>';

  // filter bar
  html += '<div class="task-card" style="padding:1rem 1.2rem;">'
    + '<div style="display:flex; gap:.6rem; flex-wrap:wrap; align-items:center;">'
    + '<input id="wtSearch" placeholder="🔍 搜索单词或中文…" value="'+esc(wtFilter.q)+'" style="flex:1;min-width:160px;padding:.55rem .8rem;border:none;border-radius:14px;background:rgba(241,245,249,.8);font-size:.85rem;"/>'
    + '<select id="wtPhase" style="padding:.55rem .8rem;border:none;border-radius:14px;background:rgba(241,245,249,.8);font-size:.82rem;">'
    + '<option value="0">全部（含自定义）</option>'
    + '<option value="1"'+(wtFilter.phase===1?' selected':'')+'>核心词汇期 Day1-30</option>'
    + '<option value="2"'+(wtFilter.phase===2?' selected':'')+'>外贸实务期 Day31-60</option>'
    + '<option value="3"'+(wtFilter.phase===3?' selected':'')+'>行业冲刺期 Day61-90</option>'
    + '<option value="99"'+(wtFilter.phase===99?' selected':'')+'>⭐ 仅自定义生词</option>'
    + '</select>'
    + '</div>'
    + '<div style="margin-top:.6rem; font-size:.72rem; color:var(--c-text-light); display:flex;gap:1rem;flex-wrap:wrap;">'
    + '<span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#1E293B;margin-right:4px;"></span>未学习</span>'
    + '<span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:rgba(125,211,252,.4);margin-right:4px;"></span>当天刚背过</span>'
    + '<span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:rgba(110,231,183,.4);margin-right:4px;text-decoration:line-through;"></span>已复习(删除线)</span>'
    + '</div></div>';

  // filter
  const q = wtFilter.q.trim().toLowerCase();
  const filtered = all.filter(w => {
    if (wtFilter.phase === 99) { if (!w.custom) return false; }
    else if (wtFilter.phase) { if (w.phase !== wtFilter.phase) return false; }
    if (q && !w.en.toLowerCase().includes(q) && !w.cn.toLowerCase().includes(q)) return false;
    return true;
  });

  // group by first letter A-Z
  const groups = {};
  filtered.forEach(w => {
    const letter = w.en.charAt(0).toUpperCase();
    const key = /[A-Z]/.test(letter) ? letter : "#";
    groups[key] = groups[key] || [];
    groups[key].push(w);
  });
  const letters = Object.keys(groups).sort((a,b) => a.localeCompare(b));

  if (!filtered.length) {
    html += '<div class="task-card"><div class="sent-cn" style="padding:1rem;">没有匹配的单词。</div></div>';
  } else {
    letters.forEach(letter => {
      const list = groups[letter];
      html += '<div class="task-card"><div class="sec-title" style="font-size:1.1rem; color:var(--c-primary); font-weight:700;">'+letter+' <span class="sec-sub">'+list.length+' 词</span></div>';
      list.forEach(w => {
        const k = w.en.toLowerCase();
        const st = ws[k] || "";
        const stClass = st==="new" ? " wt-new" : (st==="reviewed" ? " wt-reviewed" : "");
        const stLabel = st==="new" ? " · 刚背过" : (st==="reviewed" ? " · 已复习" : "");
        const badge = w.custom
          ? '<span style="margin-left:auto;font-size:.65rem;color:#B45309;background:#FEF3C7;padding:.1rem .4rem;border-radius:6px;white-space:nowrap;">⭐ 自定义'+stLabel+'</span>'
          : '<span style="margin-left:auto;font-size:.65rem;color:var(--c-text-light);white-space:nowrap;">Day'+w.firstDay+stLabel+'</span>';
        html += '<div class="word-item wt-word'+stClass+'" data-en="'+esc(w.en)+'" style="cursor:pointer;">'
          + '<div class="word-row">'
          + '<button class="speak-btn" onclick="event.stopPropagation();speak(\''+w.en.replace(/'/g,"\\'")+'\')" title="朗读">🔊</button>'
          + '<span class="word-en">'+esc(w.en)+'</span>'
          + (PHONETICS[k]?'<span class="phon">'+PHONETICS[k]+'</span>':'')
          + (w.pos?'<span class="word-pos">'+esc(w.pos)+'</span>':'')
          + '<span class="word-cn">'+esc(w.cn)+'</span>'
          + badge
          + '</div>'
          + '</div>';
      });
      html += '</div>';
    });
  }

  html += '<div style="text-align:center; margin-top:1rem;"><button class="settings-btn" id="wtBack">← 返回每日计划</button></div>';
  area.innerHTML = html;

  // events
  document.getElementById("wtBack").onclick = () => { viewMode="day"; renderAll(); };
  document.getElementById("wtSearch").oninput = (e) => { wtFilter.q = e.target.value; renderWordTable(); };
  document.getElementById("wtPhase").onchange = (e) => { wtFilter.phase = parseInt(e.target.value||"0"); renderWordTable(); };
  // click word to cycle state
  area.querySelectorAll(".wt-word").forEach(el => {
    el.onclick = () => { toggleWordState(el.dataset.en); renderWordTable(); };
  });
}
