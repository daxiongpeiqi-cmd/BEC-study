<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEC Study</title>
<script src="https://imgcache.qq.com/qcloud/tcbjs/1.11.0/tcb.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { overflow-x: hidden; max-width: 100%; }
body { font-family:'OPPO Sans','PingFang SC','HarmonyOS Sans','Noto Sans SC', system-ui, -apple-system, 'Segoe UI', sans-serif;
  overflow-wrap:break-word; word-break:break-word;
  color:#1E293B; line-height:1.6; min-height:100vh;
  background-color:#eef4f8;
  background-image:
    radial-gradient(ellipse 80% 60% at 15% 0%, rgba(125,211,252,.4) 0%, transparent 50%),
    radial-gradient(ellipse 70% 50% at 85% 20%, rgba(110,231,183,.35) 0%, transparent 50%),
    radial-gradient(ellipse 60% 40% at 50% 80%, rgba(186,230,253,.3) 0%, transparent 50%);
  background-attachment:fixed; }
.container { max-width:960px; margin:0 auto; padding:1.2rem 1.2rem 7rem; animation:fadeIn .4s ease; }
@keyframes fadeIn { from { opacity:0; transform:translateY(6px);} to { opacity:1; transform:translateY(0);} }

:root {
  --c-grad:linear-gradient(135deg,#7DD3FC 0%,#6EE7B7 100%);
  --c-grad-soft:linear-gradient(135deg,rgba(125,211,252,.25) 0%,rgba(110,231,183,.25) 100%);
  --c-primary:#38BDF8;
  --c-text:#1E293B; --c-text-light:#94A3B8;
  --c-card:rgba(255,255,255,.65); --c-card-border:rgba(255,255,255,.8);
  --c-shadow:0 4px 24px rgba(30,64,175,.06), inset 0 1px 0 rgba(255,255,255,.6);
  --c-shadow-hover:0 8px 32px rgba(30,64,175,.12), inset 0 1px 0 rgba(255,255,255,.8);
  --c-radius:20px;
  --spring:cubic-bezier(0.34,1.56,0.64,1);
}

.progress-track { height:6px; background:rgba(255,255,255,.5); border-radius:999px; overflow:hidden; margin:.8rem 0; box-shadow:inset 0 1px 2px rgba(0,0,0,.05); }
.progress-fill { height:100%; background:var(--c-grad); border-radius:999px; transition:width .6s var(--spring); }
@keyframes confetti { 0%{transform:translateY(0) rotate(0);opacity:1;} 100%{transform:translateY(-120px) rotate(360deg);opacity:0;} }
.confetti-piece { position:fixed; width:6px; height:6px; border-radius:50%; pointer-events:none; z-index:300; animation:confetti 1s ease-out forwards; }

.header { background:var(--c-card); backdrop-filter:blur(24px) saturate(180%); -webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid var(--c-card-border); padding:1.4rem 1.6rem; border-radius:var(--c-radius);
  margin-bottom:1.2rem; display:flex; justify-content:space-between; align-items:center; gap:1rem; box-shadow:var(--c-shadow); }
.header h1 { font-size:1.25rem; font-weight:700; color:var(--c-text); letter-spacing:-.01em; }
.header .sub { color:var(--c-text-light); margin-top:.25rem; font-size:.82rem; }
.countdown { text-align:right; flex-shrink:0; }
.countdown .days { font-size:1.8rem; font-weight:700; line-height:1.1; background:var(--c-grad); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
.countdown .label { font-size:.72rem; color:var(--c-text-light); margin-top:.2rem; }

.tab-bar { position:fixed; bottom:1rem; left:50%; transform:translateX(-50%);
  display:flex; gap:.3rem; padding:.45rem .6rem; border-radius:999px;
  background:rgba(255,255,255,.55); backdrop-filter:blur(24px) saturate(180%); -webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid rgba(255,255,255,.7); box-shadow:0 8px 32px rgba(30,64,175,.12); z-index:50; max-width:94vw;
  overflow-x:auto; overflow-y:hidden; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
.tab-bar::-webkit-scrollbar { display:none; }
.tab-btn { padding:.5rem 1rem; border:none; border-radius:999px; background:transparent; color:var(--c-text-light);
  font-size:.8rem; font-weight:600; cursor:pointer; transition:all .3s var(--spring); white-space:nowrap; flex-shrink:0; }
.tab-btn:hover:not(.locked):not(.active) { background:rgba(255,255,255,.6); color:var(--c-primary); }
.tab-btn.active { background:var(--c-grad); color:#fff; box-shadow:0 2px 10px rgba(56,189,248,.4); }
.tab-btn.locked { opacity:.4; cursor:not-allowed; }

.cal-section { background:var(--c-card); backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid var(--c-card-border); padding:1.2rem 1.4rem; margin-bottom:1.2rem; border-radius:var(--c-radius); box-shadow:var(--c-shadow); }
.cal-section h2 { font-size:.95rem; color:var(--c-text); margin-bottom:.8rem; display:flex; align-items:center; gap:.5rem; font-weight:700; }
.cal-months { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:1rem; }
.cal-month { background:rgba(255,255,255,.5); border-radius:16px; padding:.8rem; transition:all .3s var(--spring); }
.cal-month:hover { background:rgba(255,255,255,.8); transform:translateY(-2px); }
.cal-month .m-title { font-size:.8rem; font-weight:700; color:var(--c-text); margin-bottom:.5rem; text-align:center; }
.cal-month .m-legend { display:flex; justify-content:space-between; font-size:.65rem; color:var(--c-text-light); margin-bottom:.3rem; }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
.cal-grid .dow { font-size:.6rem; color:var(--c-text-light); text-align:center; padding:1px 0; }
.cal-cell { aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:.72rem; border-radius:10px; cursor:pointer; position:relative; color:var(--c-text-light); transition:all .2s; }
.cal-cell.empty { background:transparent; cursor:default; }
.cal-cell.has { background:rgba(241,245,249,.6); color:var(--c-text); }
.cal-cell.has:hover { background:rgba(125,211,252,.3); }
.cal-cell.done { background:rgba(110,231,183,.35); color:#059669; }
.cal-cell.done::after { content:"\2713"; position:absolute; top:2px; right:3px; font-size:.55rem; font-weight:700; }
.cal-cell.current { background:var(--c-grad); color:#fff; font-weight:700; }
.cal-cell.today-cal { outline:2px solid #F59E0B; outline-offset:-2px; }

.day-banner { background:var(--c-card); backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid var(--c-card-border); padding:1.2rem 1.4rem; margin-bottom:1rem; display:flex; justify-content:space-between;
  align-items:center; gap:1rem; flex-wrap:wrap; border-radius:var(--c-radius); box-shadow:var(--c-shadow); }
.day-banner .db-left h2 { font-size:1.1rem; font-weight:700; color:var(--c-text); }
.day-banner .db-left .meta { font-size:.8rem; color:var(--c-text-light); margin-top:.2rem; }
.day-badge { background:var(--c-grad-soft); color:#0284C7; padding:.3rem .9rem; border-radius:999px; font-size:.78rem; font-weight:600; }

.task-card { background:var(--c-card); backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid var(--c-card-border); padding:1.4rem; margin-bottom:1rem; border-radius:var(--c-radius); box-shadow:var(--c-shadow);
  transition:transform .3s var(--spring), box-shadow .3s ease; animation:cardIn .35s ease both; }
.task-card:hover { transform:translateY(-3px); box-shadow:var(--c-shadow-hover); }
@keyframes cardIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

.sec-title { font-size:.82rem; font-weight:700; color:var(--c-text); letter-spacing:.02em; margin:.8rem 0 .5rem; display:flex; align-items:center; gap:.5rem; }
.sec-title svg { width:15px; height:15px; color:var(--c-primary); }
.sec-sub { font-size:.72rem; color:var(--c-text-light); font-weight:400; }

.task-list { display:flex; flex-direction:column; gap:.5rem; margin-bottom:.5rem; }
.task-item { display:flex; gap:.7rem; align-items:flex-start; padding:.7rem .9rem;
  background:rgba(255,255,255,.5); border-radius:14px; font-size:.85rem; transition:all .3s var(--spring); color:var(--c-text); }
.task-item:hover { background:rgba(255,255,255,.85); transform:translateX(3px); }
.task-item .ti-icon { flex-shrink:0; width:26px; height:26px; border-radius:10px; background:var(--c-grad-soft); color:var(--c-primary); display:flex; align-items:center; justify-content:center; }
.task-item .ti-icon svg { width:14px; height:14px; }
.task-item b { color:var(--c-text); font-weight:600; }

.word-list { display:flex; flex-direction:column; gap:.4rem; }
.word-item { padding:.6rem .8rem; background:rgba(255,255,255,.5); border-radius:14px; transition:all .25s; }
.word-item:hover { background:rgba(255,255,255,.85); }
.word-item.wt-new { background:rgba(125,211,252,.18); }
.word-item.wt-new:hover { background:rgba(125,211,252,.3); }
.word-item.wt-reviewed { background:rgba(110,231,183,.18); }
.word-item.wt-reviewed:hover { background:rgba(110,231,183,.3); }
.word-item.wt-reviewed .word-en { text-decoration: line-through; color:#64748B; }
.word-row { display:flex; align-items:baseline; gap:.4rem; flex-wrap:wrap; }
.word-en { font-weight:700; color:var(--c-text); font-size:.92rem; }
.word-pos { font-size:.7rem; color:var(--c-text-light); font-style:italic; }
.word-cn { font-size:.8rem; color:var(--c-text-light); margin-left:auto; }
.word-tag { font-size:.62rem; padding:.1rem .4rem; border-radius:6px; margin-left:.3rem; font-weight:600; }
.word-tag.new { background:var(--c-grad-soft); color:#0284C7; }
.word-tag.review { background:#FEF3C7; color:#B45309; }

.sent-list { display:flex; flex-direction:column; gap:.5rem; }
.sent-item { padding:.55rem .7rem; background:rgba(255,255,255,.5); border-radius:14px; }
.sent-en { font-size:.82rem; color:var(--c-text); font-style:italic; }
.sent-cn { font-size:.78rem; color:var(--c-text-light); margin-top:.15rem; }

.audio-wrap { background:rgba(255,255,255,.5); border-radius:14px; padding:.6rem; margin:.5rem 0; }
.audio-wrap audio { width:100%; height:38px; }

details summary { cursor:pointer; font-size:.82rem; color:var(--c-primary); font-weight:600;
  padding:.5rem .7rem; background:rgba(255,255,255,.5); border-radius:14px; list-style:none;
  display:flex; align-items:center; gap:.4rem; transition:background .2s; }
details summary:hover { background:rgba(255,255,255,.85); }
details summary::-webkit-details-marker { display:none; }
details summary::before { content:"\25B8"; transition:transform .2s; }
details[open] summary::before { content:"\25BE"; }
.dialogue-body { padding:.7rem; background:rgba(255,255,255,.5); border-radius:14px; font-size:.8rem; color:var(--c-text); margin-top:.4rem; max-height:300px; overflow-y:auto; }
.dialogue-body p { margin-bottom:.5rem; }
.dialogue-body p:last-child { margin-bottom:0; }
.dialogue-body .sp { color:var(--c-primary); font-weight:600; margin-right:.3rem; }

.quiz-block { background:rgba(255,255,255,.5); border-radius:var(--c-radius); padding:1rem; margin-top:.5rem; }
.quiz-q { padding:.8rem; background:rgba(255,255,255,.8); border-radius:14px; margin-bottom:.5rem; box-shadow:var(--c-shadow); }
.quiz-q .q-type { display:inline-block; font-size:.62rem; font-weight:700; padding:.1rem .4rem; border-radius:6px; margin-bottom:.3rem; }
.q-type.t1 { background:var(--c-grad-soft); color:#0284C7; }
.q-type.t2 { background:#FEF3C7; color:#B45309; }
.q-type.t3 { background:rgba(110,231,183,.3); color:#059669; }
.q-type.t4 { background:#FCE7F3; color:#be185d; }
.quiz-q .q-text { font-size:.85rem; margin-bottom:.5rem; color:var(--c-text); }
.quiz-opts { display:flex; flex-direction:column; gap:.3rem; }
.quiz-opt { padding:.5rem .7rem; border:none; border-radius:14px; font-size:.8rem; cursor:pointer; transition:all .2s var(--spring); background:rgba(241,245,249,.6); color:var(--c-text); }
.quiz-opt:hover { background:rgba(125,211,252,.25); }
.quiz-opt.selected { background:var(--c-grad-soft); color:#0284C7; font-weight:600; }
.quiz-opt.correct { background:rgba(110,231,183,.35); color:#059669; }
.quiz-opt.wrong { background:rgba(254,202,202,.5); color:#991b1b; }
.quiz-score { padding:1rem; background:var(--c-grad-soft); border-radius:14px; text-align:center; font-weight:600; color:#0284C7; margin-top:.6rem; }
.quiz-submit { background:var(--c-grad); color:#fff; border:none; padding:.65rem 1.4rem; border-radius:999px; font-weight:600; cursor:pointer; margin-top:.6rem; transition:all .3s var(--spring); box-shadow:0 2px 10px rgba(56,189,248,.3); }
.quiz-submit:hover { transform:translateY(-2px) scale(1.02); }

.write-block { background:rgba(255,255,255,.5); border-radius:var(--c-radius); padding:1rem 1.2rem; margin-top:.5rem; }
.accept-block { background:rgba(254,243,199,.5); border-radius:var(--c-radius); padding:1rem; margin:.8rem 0; border:1px solid rgba(245,158,11,.2); }
.accept-input { width:100%; padding:.55rem .8rem; border:none; border-radius:14px; font-size:.9rem; margin-top:.3rem; background:rgba(255,255,255,.8); box-shadow:var(--c-shadow); }
.accept-input:focus { outline:2px solid #F59E0B; }
.accept-status { padding:.8rem; border-radius:14px; margin-top:.6rem; text-align:center; font-weight:600; }
.accept-status.pass { background:rgba(110,231,183,.35); color:#059669; }
.accept-status.fail { background:rgba(254,202,202,.5); color:#991b1b; }

.wrong-item { background:rgba(255,255,255,.7); border-radius:14px; padding:.8rem; margin-bottom:.5rem; box-shadow:var(--c-shadow); }
.wrong-item .w-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:.4rem; }
.wrong-item .w-count { background:rgba(254,202,202,.5); color:#dc2626; font-size:.7rem; font-weight:700; padding:.15rem .5rem; border-radius:999px; }
.wrong-item .w-mastered { background:rgba(110,231,183,.35); color:#059669; font-size:.7rem; padding:.15rem .5rem; border-radius:999px; }
.wrong-item button { font-size:.72rem; padding:.3rem .6rem; border:none; border-radius:999px; cursor:pointer; margin-left:.4rem; }
.wrong-item .btn-master { background:var(--c-grad-soft); color:#0284C7; }
.wrong-item .btn-redo { background:#FEF3C7; color:#B45309; }
.write-block .w-prompt { font-size:.85rem; color:var(--c-text); margin-bottom:.5rem; }
.write-block .w-note { font-size:.78rem; color:#059669; background:rgba(110,231,183,.25); padding:.5rem .7rem; border-radius:14px; margin-top:.5rem; }
.write-block .w-template { font-size:.82rem; color:var(--c-text); font-style:italic; margin-top:.4rem; padding:.5rem .7rem; background:rgba(255,255,255,.7); border-radius:14px; }

.exam-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:1rem; margin-top:1rem; }
.exam-card { background:var(--c-card); backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid var(--c-card-border); padding:1.2rem; border-radius:var(--c-radius); box-shadow:var(--c-shadow);
  transition:all .3s var(--spring); cursor:pointer; }
.exam-card:hover { transform:translateY(-3px); box-shadow:var(--c-shadow-hover); }
.exam-card h3 { color:var(--c-text); font-size:1rem; margin-bottom:.4rem; font-weight:700; }
.exam-card .meta { font-size:.78rem; color:var(--c-text-light); }
.exam-timer { background:var(--c-grad); color:#fff; border-radius:var(--c-radius); padding:1rem 1.5rem; text-align:center; margin-bottom:1rem; font-size:1.6rem; font-weight:700; box-shadow:0 4px 20px rgba(56,189,248,.3); }
.exam-timer.danger { background:linear-gradient(135deg,#F87171,#EF4444); }

.checkin-row { display:flex; justify-content:center; gap:.6rem; margin:1rem 0; flex-wrap:wrap; align-items:center; }
.checkin-btn, .settings-btn { padding:.55rem 1rem; border-radius:999px; font-size:.82rem; font-weight:600;
  cursor:pointer; transition:all .3s var(--spring); display:inline-flex; align-items:center; justify-content:center;
  height:40px; width:130px; line-height:1.2; white-space:nowrap; border:none; }
.checkin-btn { background:var(--c-grad); color:#fff; box-shadow:0 2px 10px rgba(56,189,248,.4); }
.checkin-btn:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 6px 20px rgba(56,189,248,.5); }
.checkin-btn:disabled { background:rgba(226,232,240,.8); color:var(--c-text-light); cursor:not-allowed; box-shadow:none; }
.checkin-btn.pulse { animation:bounce .4s ease; }
@keyframes bounce { 0%{transform:scale(1);} 50%{transform:scale(1.1);} 100%{transform:scale(1);} }
.settings-btn { background:rgba(255,255,255,.7); backdrop-filter:blur(10px); color:var(--c-text); box-shadow:var(--c-shadow); border:1px solid rgba(255,255,255,.8); }
.settings-btn:hover { background:rgba(255,255,255,.95); color:var(--c-primary); }

.modal-overlay { position:fixed; inset:0; background:rgba(15,23,42,.3); backdrop-filter:blur(8px); display:none; align-items:center; justify-content:center; z-index:100; animation:fadeIn .2s; }
.modal-overlay.show { display:flex; }
.modal { background:rgba(255,255,255,.85); backdrop-filter:blur(30px) saturate(180%); -webkit-backdrop-filter:blur(30px) saturate(180%);
  border:1px solid rgba(255,255,255,.9); border-radius:var(--c-radius); padding:1.5rem; width:90%; max-width:380px; box-shadow:0 20px 50px rgba(0,0,0,.15); }
.modal h3 { color:var(--c-text); margin-bottom:1rem; font-size:1rem; font-weight:700; }
.modal label { font-size:.8rem; color:var(--c-text-light); display:block; margin-bottom:.3rem; }
.modal input[type=time] { width:100%; padding:.6rem; border:none; border-radius:14px; background:rgba(241,245,249,.8); font-size:1rem; margin-bottom:1rem; }
.modal .modal-actions { display:flex; gap:.6rem; justify-content:flex-end; }
.modal .modal-actions button { padding:.5rem 1.2rem; border-radius:999px; border:none; cursor:pointer; font-weight:600; font-size:.82rem; }
.modal .btn-save { background:var(--c-grad); color:#fff; }
.modal .btn-cancel { background:rgba(241,245,249,.8); color:var(--c-text); }

.toast { position:fixed; bottom:6rem; left:50%; transform:translateX(-50%) translateY(10px);
  background:rgba(255,255,255,.8); backdrop-filter:blur(20px) saturate(180%); color:var(--c-text); padding:.7rem 1.2rem; border-radius:999px;
  font-size:.82rem; opacity:0; pointer-events:none; transition:all .3s var(--spring); z-index:99;
  box-shadow:0 4px 20px rgba(15,23,42,.12); border:1px solid rgba(255,255,255,.8); }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
.footer { text-align:center; font-size:.75rem; color:var(--c-text-light); margin-top:2rem; padding-top:1rem; }

.lookup-popup { position:fixed; z-index:200; background:rgba(255,255,255,.85); backdrop-filter:blur(24px) saturate(180%);
  border:1px solid rgba(255,255,255,.9); border-radius:16px; box-shadow:0 8px 32px rgba(15,23,42,.15);
  padding:.8rem .9rem; width:230px; max-width:80vw; font-size:.8rem; animation:fadeIn .15s ease; }
.lookup-popup::after { content:""; position:absolute; width:0; height:0; border:8px solid transparent; }
.lookup-popup.arrow-top::after { top:-14px; left:20px; border-bottom-color:rgba(255,255,255,.9); }
.lookup-popup.arrow-bottom::after { bottom:-14px; left:20px; border-top-color:rgba(255,255,255,.9); }
.lookup-popup.arrow-left::after { top:20px; left:-14px; border-right-color:rgba(255,255,255,.9); }
.lookup-popup.arrow-right::after { top:20px; right:-14px; border-left-color:rgba(255,255,255,.9); }
.lookup-popup .lp-word { font-size:.95rem; font-weight:700; color:var(--c-text); }
.lookup-popup .lp-phon { color:var(--c-text-light); font-size:.72rem; font-style:italic; margin-left:.3rem; }
.lookup-popup .lp-pos { display:inline-block; font-size:.65rem; color:#B45309; background:#FEF3C7; padding:.1rem .35rem; border-radius:6px; margin:.25rem 0; }
.lookup-popup .lp-cn { color:var(--c-text); margin:.15rem 0 .4rem; font-size:.78rem; }
.lookup-popup .lp-actions { display:flex; gap:.35rem; margin-top:.4rem; }
.lookup-popup .lp-actions button { font-size:.7rem; padding:.3rem .6rem; border:none; border-radius:999px; cursor:pointer; min-height:30px; }
.lookup-popup .lp-save { background:var(--c-grad-soft); color:#0284C7; }
.lookup-popup .lp-close { background:rgba(241,245,249,.8); color:var(--c-text); margin-left:auto; }

.word-row .phon { color:var(--c-text-light); font-size:.7rem; font-style:italic; }
.speak-btn { background:none; border:none; cursor:pointer; font-size:.8rem; padding:2px 4px; min-width:28px; min-height:28px; }
.speak-btn:hover { transform:scale(1.1); }
.word-example { font-size:.72rem; color:var(--c-text-light); font-style:italic; margin-top:.25rem; padding-left:.2rem; }
.word-example-cn { font-size:.7rem; color:#CBD5E1; margin-top:.1rem; }

.reading-block { background:rgba(255,255,255,.5); border-radius:var(--c-radius); padding:1rem 1.2rem; margin:.5rem 0; }
.reading-block .r-passage { font-size:.82rem; color:var(--c-text); line-height:1.7; }
.reading-block .r-question { font-size:.8rem; margin:.5rem 0; }

div[style*="fef9c3"] { border-radius:var(--c-radius) !important; backdrop-filter:blur(10px); }

@media (max-width: 768px) {

t is the latest checkout time?", "cn": "最晚退房时间是几点？"}], "dialogue": [{"speaker": "讲解", "line": "I would like to apply for a visa. I am here to submit my visa application. How long is the visa valid for? What is the duration of the visa? His visitor's visa expired. My visa expires next month. They overstayed their visa."}, {"speaker": "讲解", "line": "If we leave now, I can catch the earlier flight. Flight BA4793 is now boarding at Gate 174. The details of today's flights are displayed on the monitor. The flight has been delayed due to some mechanical troubles. We apologize for the delay and regret any inconvenience it may have caused."}, {"speaker": "讲解", "line": "You can check your baggage right through to its final destination. We checked in our luggage and went through to the departure lounge. Please put the suitcase on the scale. Is it overweight? Which carousel is the Chicago flight's baggage on?"}, {"speaker": "讲解", "line": "Everyone was frisked before getting on the plane. Why am I being selected for additional screening? What is the liquid allowance in my carry-on? Can I bring liquids through security? Are there any restrictions on items I can carry on board?"}, {"speaker": "讲解", "line": "We eventually took off at 10:00 and arrived in Shanghai at 12:02. Our plane climbed to 33,000 feet. Can I upgrade to Business Class? Could you please get some airsickness medicine for me? Our flight is expected to arrive on time. Ladies and gentlemen, we are about to begin our descent into Los Angeles."}, {"speaker": "讲解", "line": "The flight was canceled because of the heavy fog. All flights have been canceled because of bad weather. They announced that the flight would be delayed. My flight was an hour late. How many hours are we behind schedule? As a result of the heavy fog, all flights have been delayed."}, {"speaker": "讲解", "line": "Is there a quarantine process for incoming passengers? I have nothing to declare. I hope I'll be able to catch the connecting flight. We had a two-day stopover in Fiji on the way to Australia. I transferred at Bahrain for a flight to Singapore. My flight was late and I missed the connection."}, {"speaker": "讲解", "line": "Can you tell me the rate for a single room, please? Does the charge include everything? Do extra beds cost more? Could you please check if my reservation is ready? What name is the reservation under? How much is the deposit for the room?"}, {"speaker": "讲解", "line": "What kind of entertainment do you have? Do you offer room service? How much does your laundry service cost? I want to change the room because it's too noisy next door. There is something wrong with my key card and I'm locked out. The heater doesn't work in my room."}, {"speaker": "讲解", "line": "What is the latest checkout time? Could you give me the room key, please? Could you please give me an official receipt? I paid in cash. What's this charge for? I'd like a receipt, please. The laundry charge is too high."}]}, {"id": "part1.chapter5", "title": "Business Meetings, Memos & Emails | 商务会议、备忘录与商务邮件", "scene": "商务会议全流程：会前场地设备与参会人确认、会议议程分发、头脑风暴、议题讨论、达成共识，以及会后备忘录、演示简报与商务邮件撰写规范", "words": [{"en": "agenda", "pos": "n.", "cn": "议程；日程"}, {"en": "attendance", "pos": "n.", "cn": "出席；参会人数"}, {"en": "brainstorm", "pos": "v./n.", "cn": "头脑风暴"}, {"en": "adjourn", "pos": "v.", "cn": "休会；暂停"}, {"en": "consensus", "pos": "n.", "cn": "共识；一致"}, {"en": "memo", "pos": "n.", "cn": "备忘录"}, {"en": "briefing", "pos": "n.", "cn": "简报；情况说明"}, {"en": "presentation", "pos": "n.", "cn": "演示；报告"}, {"en": "constructive", "pos": "adj.", "cn": "建设性的"}, {"en": "proposal", "pos": "n.", "cn": "提案；建议"}, {"en": "minutes", "pos": "n.", "cn": "会议纪要"}, {"en": "notification", "pos": "n.", "cn": "通知"}, {"en": "quotation", "pos": "n.", "cn": "报价单"}, {"en": "attachment", "pos": "n.", "cn": "附件"}, {"en": "endorse", "pos": "v.", "cn": "认可；支持"}], "sentences": [{"en": "Have we confirmed the attendance list for the meeting?", "cn": "我们确认参会人员名单了吗？"}, {"en": "We'll have to postpone the meeting until next week.", "cn": "我们不得不把会议推迟到下周。"}, {"en": "The brainstorm meeting was very successful and we came up with several great new ideas.", "cn": "头脑风暴会议非常成功，我们想出了几个很棒的新点子。"}, {"en": "You don't have to win every argument, just agree to disagree.", "cn": "你不必赢得每场争论，求同存异即可。"}, {"en": "I totally agree with you.", "cn": "我完全同意你的看法。"}, {"en": "This memo serves as a reminder of the key points discussed during our last meeting.", "cn": "本备忘录旨在提醒大家上次会议讨论的要点。"}, {"en": "We would like to request a quotation for the products listed below.", "cn": "我们希望就以下产品索取报价。"}, {"en": "Please acknowledge receipt of this letter and confirm that you are in agreement with the proposed terms.", "cn": "请确认收悉本函，并确认您同意所提条款。"}], "dialogue": [{"speaker": "讲解", "line": "Have we confirmed the attendance list for the meeting? Please let me know if there are any changes to the participant list. There was an attendance of 100 at the meeting."}, {"speaker": "讲解", "line": "The seating arrangement has been made according to the organizational hierarchy. Make sure all the necessary equipment, such as projectors and microphones, are in place and working properly. The meeting will be held at 9 a.m. sharp in the conference room on the second floor. We'll have to postpone the meeting until next week."}, {"speaker": "讲解", "line": "Could you please distribute the meeting agenda and related materials to everyone? Hand out the minutes of the last meeting before we proceed. What is the next item on the agenda? The next item on the agenda is the publicity budget. A lot of dignitaries will attend the meeting."}, {"speaker": "讲解", "line": "The brainstorm meeting was very successful and we came up with several great new ideas. Brainstorming is a great way to get the creative juices flowing and generate new ideas. The key to a successful meeting is keeping it moving forward. Let's summarize the key outcomes of our meeting. You don't have to win every argument, just agree to disagree."}, {"speaker": "讲解", "line": "We have already debated the matter. These topics are related to the problem. What shall we discuss next? Could you elaborate on that? What do you think about the problem of reducing cost? Which of the advertisements fit our product? Are you for or against his idea? This suggestion is constructive, isn't it?"}, {"speaker": "讲解", "line": "I totally agree with you. I couldn't agree more. I'm with you there. It seems that we really reach an agreement now. I don't object to it. Up to a point, I agree with you, but I don't think it will work. I'm afraid that's not entirely accurate. To be honest, I can't agree with your point of view."}, {"speaker": "讲解", "line": "Have you already notified everyone who will attend the meeting? You should receive notification of our decision in the next week. Please find attached the meeting notification for the upcoming business conference. This memo serves as a reminder of the key points discussed during our last meeting. I want this memo to go to all managers. Please note the deadline for submitting your report is next Friday."}, {"speaker": "讲解", "line": "This briefing aims to provide an overview of our recent project progress. The first slide summarizes our key achievements for the quarter. The following chart illustrates the sales trends over the past year. This graph compares our market share with our main competitors."}, {"speaker": "讲解", "line": "We would like to request a quotation for the products listed below. Please find our order form for the goods you quoted. We hereby confirm our acceptance of the terms and conditions stated in the contract. We greatly appreciate your efforts in resolving this issue to our satisfaction. Please do not hesitate to contact me if you have any questions or concerns."}]}, {"id": "part1.chapter6", "title": "Corporate Strategy, Performance & Factory Tour | 企业运营、绩效与工厂参观", "scene": "企业介绍与实地考察：行业属性与公司架构、发展战略与战略合作、KPI与营收利润绩效、研发投入与产品迭代、工厂产能与自动化产线参观", "words": [{"en": "multinational", "pos": "adj./n.", "cn": "跨国的；跨国公司"}, {"en": "subsidiary", "pos": "n.", "cn": "子公司；附属机构"}, {"en": "turnover", "pos": "n.", "cn": "营业额；人员流动率"}, {"en": "acquisition", "pos": "n.", "cn": "收购；并购"}, {"en": "innovation", "pos": "n.", "cn": "创新"}, {"en": "KPI", "pos": "abbr.", "cn": "关键绩效指标"}, {"en": "revenue", "pos": "n.", "cn": "收入；营收"}, {"en": "profit", "pos": "n.", "cn": "利润"}, {"en": "prototype", "pos": "n.", "cn": "原型；样品"}, {"en": "R&D", "pos": "abbr.", "cn": "研究与开发"}, {"en": "capacity", "pos": "n.", "cn": "产能；容量"}, {"en": "assembly", "pos": "n.", "cn": "装配；组装"}, {"en": "automation", "pos": "n.", "cn": "自动化"}, {"en": "delegation", "pos": "n.", "cn": "代表团"}, {"en": "sustainability", "pos": "n.", "cn": "可持续性"}], "sentences": [{"en": "We are a large multinational.", "cn": "我们是一家大型跨国公司。"}, {"en": "Our registered capital is 40 million RMB.", "cn": "我们的注册资本为4000万人民币。"}, {"en": "After 20 years of growth, we have become the world's largest private employer and retailer.", "cn": "经过20年发展，我们已成为全球最大的私人雇主和零售商。"}, {"en": "We are spending $850 million on research and development.", "cn": "我们在研发上投入8.5亿美元。"}, {"en": "The prototype was tested with a small group of users before going into full production.", "cn": "原型在全面投产前经过了一小群用户的测试。"}, {"en": "We reached a maximum sales volume of 300,000 last year.", "cn": "我们去年达到了30万辆的最高销量。"}, {"en": "Our factory is working at full capacity.", "cn": "我们的工厂正在满负荷运转。"}, {"en": "Our factory turns out 900 cars a week.", "cn": "我们工厂每周生产900辆汽车。"}], "dialogue": [{"speaker": "讲解", "line": "We are a large multinational. Our firm manufactures and retails its own range of sportswear. Our registered capital is 40 million RMB. We have tried to reinvent our retail stores."}, {"speaker": "讲解", "line": "We lead the field in home entertainment systems. We work in the automotive industry focusing on electric vehicle development. Our company is a leading player in the fashion industry, which is known for innovative designs. Our company consists of seven departments. They each have their own territory unit."}, {"speaker": "讲解", "line": "After 20 years of growth, we have become the world's largest private employer and retailer. We had the foresight to invest in new technology. We're looking to start a new partnership with two big companies. Our firm has close ties with an American corporation. We have collaborated on many projects over the years."}, {"speaker": "讲解", "line": "Sales figures continue to show signs of improvement. Is there a specific department responsible for research and development? It is the end product of exhaustive research and development. We are spending $850 million on research and development. The latest features embody the latest trends in technology and user experience. The prototype was tested with a small group of users before going into full production."}, {"speaker": "讲解", "line": "We reached a maximum sales volume of 300,000 last year. 100% of the employees successfully reached their sales volume goals. My company intends to enter a promising market. The company is forging ahead with its plans for expansion. Have you achieved the KPI key performance indicator last month?"}, {"speaker": "讲解", "line": "What is the sale performance of the new car model? Sales are actually beginning to go up. The North China region had the largest growth. October and November saw gradual improvement. Our auto sales have been lagging for 5 months now."}, {"speaker": "讲解", "line": "Our factory is working at full capacity. Our factory turns out 900 cars a week. Our factory was turned over to the manufacture of aircraft parts. Automation meant the loss of many factory jobs. He gave us a very sketchy account of his visit. Now let me show you around our company and we can further exchange ideas during your visit."}, {"speaker": "讲解", "line": "What are the key aspects of employee training at the company? I'm interested in learning more about the company's sustainability initiatives."}]}, {"id": "part1.chapter7", "title": "Office Operations, Troubleshooting & Performance | 日常办公、设备故障与绩效考核", "scene": "日常办公全场景：邮政与邮件处理、复印打印与文件归档、任务分配与截止期管理、会议改期与取消、电脑打印机故障排查、工作压力应对及员工绩效评估", "words": [{"en": "postage", "pos": "n.", "cn": "邮资；邮费"}, {"en": "copier", "pos": "n.", "cn": "复印机"}, {"en": "filing", "pos": "n.", "cn": "归档；文件管理"}, {"en": "deadline", "pos": "n.", "cn": "截止日期"}, {"en": "reschedule", "pos": "v.", "cn": "重新安排；改期"}, {"en": "jam", "pos": "v./n.", "cn": "卡纸；堵塞"}, {"en": "virus", "pos": "n.", "cn": "病毒"}, {"en": "stress", "pos": "n.", "cn": "压力"}, {"en": "cope", "pos": "v.", "cn": "应对；处理"}, {"en": "appraisal", "pos": "n.", "cn": "评估；考核"}, {"en": "dedication", "pos": "n.", "cn": "奉献；投入"}, {"en": "competence", "pos": "n.", "cn": "能力；胜任力"}, {"en": "allocate", "pos": "v.", "cn": "分配；拨给"}, {"en": "proofread", "pos": "v.", "cn": "校对"}, {"en": "efficiency", "pos": "n.", "cn": "效率"}], "sentences": [{"en": "Can I mail this package by EMS?", "cn": "我可以用EMS寄这个包裹吗？"}, {"en": "Prompt and careful filing contributes heavily to the efficiency of your office.", "cn": "及时细致的归档大大提升办公室效率。"}, {"en": "Our first task is to set up a communication system.", "cn": "我们的首要任务是建立沟通系统。"}, {"en": "Can we reschedule for next week?", "cn": "我们能改到下周吗？"}, {"en": "My computer is infected by a virus.", "cn": "我的电脑感染了病毒。"}, {"en": "The copier is out of order.", "cn": "复印机出故障了。"}, {"en": "Things can easily go wrong when people are under stress.", "cn": "人在压力下很容易出错。"}, {"en": "Your hard work and dedication deserve acknowledgement.", "cn": "你的努力和奉献值得肯定。"}], "dialogue": [{"speaker": "讲解", "line": "Can I mail this package by EMS? I'd like to send this package to America. What's the postage to send this to the UK by air mail? Would you give me the zip code for Chicago?"}, {"speaker": "讲解", "line": "What is wrong with your email account? My email account kept failing to send messages. The email that I had sent you was returned. What should I do with the spam? You should turn on the spam blocking option. Have you checked your email? I haven't received your email."}, {"speaker": "讲解", "line": "Do you know how to use the copy machine? How many pages can the copier take? The copy machine in our office has a password. We'll create an organizational chart and print it out. Please add paper to the copier. I need to add ink to the copier."}, {"speaker": "讲解", "line": "Prompt and careful filing contributes heavily to the efficiency of your office. I am keeping a file of letters so I can get my hands on them whenever I need. I always file reports according to dates. Do you know how our filing system works? Outgoing and incoming correspondence is kept in the file."}, {"speaker": "讲解", "line": "Our first task is to set up a communication system. We've assigned our best man to the job. Your duties will include setting up a new computer system. We are a very efficient company. I have to finish this up for tomorrow. I have got piles of work to do. I had set myself a tough assignment. The task before us is a daunting one."}, {"speaker": "讲解", "line": "Can we reschedule for next week? Could it be postponed, if possible, till Tuesday? Is there any chance we can change the date? I was wondering if we could make it some other time. Let me check my schedule first. We'll need to make the changes to the agenda and send it out. I've cleared my schedule for the afternoon."}, {"speaker": "讲解", "line": "My computer is making a weird noise. This computer is infected by a virus. My computer is down. The computer just crashed. Something has gone wrong with my computer. It always restarts. Would you check our computer? Reinstalling is an option. You can install some antivirus software."}, {"speaker": "讲解", "line": "The copier is out of order. The photocopier is jammed. It's easy to get a paper jam. The copy machine doesn't work. Did you call a repairman?"}, {"speaker": "讲解", "line": "The job doesn't really challenge her. I got to the stage where I wasn't coping anymore. Tom wasn't able to cope with the stresses and strains of the job. I'm perfectly capable of doing it myself. We are working under extreme pressure at the moment. I found it a strain having to concentrate for so long. Things can easily go wrong when people are under stress."}, {"speaker": "讲解", "line": "Your hard work and dedication deserve acknowledgement. His performance in the project has been exceptional. Martin's job performance has been consistent right down the line. The annual performance evaluation will be conducted next week. The quarterly performance review will provide us with valuable insights. I really admire his capacity for work. Her capabilities were always there. All she needed was an opening to show them."}]}]}, {"part": 2, "theme": "外贸实务", "chapters": [{"id": "part2.chapter1", "title": "企业并购·技术转让·代理·加工装配·招投标 M&A, Technology Transfer, Agency, Processing & Bidding", "scene": "外贸合作全模块综合：企业并购谈判、技术引进、独家代理委任、加工外包与工程招投标五大实务场景。", "words": [{"en": "merger", "pos": "n.", "cn": "合并，并购"}, {"en": "acquisition", "pos": "n.", "cn": "收购"}, {"en": "due diligence", "pos": "n.", "cn": "尽职调查"}, {"en": "letter of intent", "pos": "n.", "cn": "意向书"}, {"en": "liquidation", "pos": "n.", "cn": "清算"}, {"en": "technology transfer", "pos": "n.", "cn": "技术转让"}, {"en": "patent", "pos": "n.", "cn": "专利"}, {"en": "trademark", "pos": "n.", "cn": "商标"}, {"en": "copyright assignment", "pos": "n.", "cn": "版权转让"}, {"en": "exclusive / sole agent", "pos": "n.", "cn": "独家代理"}, {"en": "subcontract", "pos": "v./n.", "cn": "分包"}, {"en": "outsourcing", "pos": "n.", "cn": "外包"}, {"en": "bid / tender", "pos": "n.", "cn": "投标/招标"}, {"en": "submission deadline", "pos": "n.", "cn": "投标截止日"}, {"en": "award", "pos": "v.", "cn": "授标，授予合同"}], "sentences": [{"en": "We are currently in the process of negotiating a potential merger with another company.", "cn": "我们目前正在与另一家公司谈判一项潜在的合并事宜。"}, {"en": "The acquisition is expected to be finalized by the end of this year.", "cn": "这项收购预计将于今年年底前完成。"}, {"en": "Post-merger integration is crucial to the success of the transaction.", "cn": "并购后的整合对交易的成功至关重要。"}, {"en": "Our company is seeking to engage in technology transfer deals with overseas partners.", "cn": "我们公司正寻求与海外伙伴开展技术转让合作。"}, {"en": "We have decided to entrust you as the sole agent for our products.", "cn": "我们决定委托你方为我方产品的独家代理。"}, {"en": "We require a minimum production capacity of 10,000 units per month.", "cn": "我们要求每月最低产能为10,000件。"}, {"en": "All bids must be submitted by the submission deadline of Sep 5, 2024.", "cn": "所有投标必须在2024年9月5日截止日期前提交。"}, {"en": "After careful consideration, we have decided to award the contract to your company.", "cn": "经过慎重考虑，我们决定将合同授予贵公司。"}], "dialogue": [{"speaker": "讲解", "line": "Merger, acquisition, integrate, consolidation, takeover, letter of intent, due diligence, going concern, liquidation."}, {"speaker": "讲解", "line": "We are currently in the process of negotiating a potential merger with another company."}, {"speaker": "讲解", "line": "The acquisition is expected to be finalized by the end of this year."}, {"speaker": "讲解", "line": "Post-merger integration is crucial to the success of the transaction."}, {"speaker": "讲解", "line": "Technology transfer, patent, trademark, copyright assignment, sub-licensing, patent validity."}, {"speaker": "讲解", "line": "Our company is seeking to engage in technology transfer deals with overseas partners."}, {"speaker": "讲解", "line": "Is your technology appropriate to China's need? Would you provide us with the necessary technical data?"}, {"speaker": "讲解", "line": "Exclusive agent, non-exclusive rights, agency agreement, confidentiality, renewal, termination."}, {"speaker": "讲解", "line": "We have decided to entrust you as the sole agent for our products."}, {"speaker": "讲解", "line": "The duration of this agreement is one year, and can be automatically extended for a further year on expiration."}, {"speaker": "讲解", "line": "We are considering outsourcing the assembly process, and will subcontract certain components to specialized suppliers."}, {"speaker": "讲解", "line": "Bid, tender, bidder, eligibility criteria, evaluation criteria, submission deadline, request for proposal."}, {"speaker": "讲解", "line": "We are issuing an invitation to bid for the construction of a new office building."}, {"speaker": "讲解", "line": "The bids will be evaluated based on price, quality and delivery time."}, {"speaker": "讲解", "line": "Congratulations on winning the bid. Now that the contract is signed, we will begin executing the project according to the agreed terms."}]}, {"id": "part2.chapter2", "title": "电话沟通·商务预约·电话留言·指路 Telephone, Appointments, Messages & Directions", "scene": "外贸日常办公沟通：电话总机转接、与客户预约时间、代接/留口信，以及为来访外商指路。", "words": [{"en": "operator", "pos": "n.", "cn": "总机接线员"}, {"en": "extension", "pos": "n.", "cn": "电话分机"}, {"en": "put through", "pos": "v.", "cn": "接通（电话）"}, {"en": "hold on / hold the line", "pos": "phr.", "cn": "请稍候，别挂线"}, {"en": "direct dialing", "pos": "n.", "cn": "直拨"}, {"en": "appointment", "pos": "n.", "cn": "预约"}, {"en": "reschedule", "pos": "v.", "cn": "重新安排时间"}, {"en": "time slot", "pos": "n.", "cn": "时间段"}, {"en": "voicemail", "pos": "n.", "cn": "语音信箱"}, {"en": "take / leave a message", "pos": "phr.", "cn": "代记/留口信"}, {"en": "return a call", "pos": "phr.", "cn": "回电话"}, {"en": "landmark", "pos": "n.", "cn": "地标"}, {"en": "intersection", "pos": "n.", "cn": "十字路口"}, {"en": "turn left / right", "pos": "phr.", "cn": "向左/右转"}, {"en": "go straight ahead", "pos": "phr.", "cn": "一直往前走"}], "sentences": [{"en": "Could you put me through to Mr. Smith / the HR department?", "cn": "请帮我接一下史密斯先生/人力资源部好吗？"}, {"en": "I'd like to make an appointment with your Finance Manager.", "cn": "我想与贵方财务经理约个时间见面。"}, {"en": "Will it be convenient for you tomorrow afternoon?", "cn": "明天下午您方便吗？"}, {"en": "She is not available at the moment. Can I take a message?", "cn": "她现在不在，需要我捎个口信吗？"}, {"en": "I'll make sure he gets your message.", "cn": "我一定把您的口信转告给他。"}, {"en": "Can you have him call me back either at home or on my cell?", "cn": "能让他给我回电话吗？打我家里或手机都行。"}, {"en": "Go straight ahead for about 500 meters, then turn right at the next intersection.", "cn": "一直往前走约500米，然后在下一个路口右转。"}, {"en": "If you get lost, feel free to call me.", "cn": "如果迷路了，随时给我打电话。"}], "dialogue": [{"speaker": "讲解", "line": "Operator, dial, hold, receiver, handset, extension, direct dialing, long distance call."}, {"speaker": "A", "line": "Could you connect me with the reservation office? Would you put me through to Mr. Smith?"}, {"speaker": "B", "line": "I'm transferring your call to the person in charge. Can I put you through to his secretary?"}, {"speaker": "A", "line": "What's the extension number of the sales department? Do I reach Extension 2412?"}, {"speaker": "讲解", "line": "Appointment, reschedule, confirm, book, convenient, availability, time slot, cancel."}, {"speaker": "A", "line": "I'd like to make an appointment with your Finance Manager. Are you free tomorrow afternoon?"}, {"speaker": "B", "line": "What about tomorrow morning? Can we fix the meeting at 10 a.m. tomorrow?"}, {"speaker": "A", "line": "If you could arrange it sometime early next week, I would be very grateful. I look forward to seeing you."}, {"speaker": "讲解", "line": "Voicemail, urgent, take a message, leave a message, return a call, secretary."}, {"speaker": "B", "line": "She is not available. Can I take a message? I'll make sure she gets it."}, {"speaker": "A", "line": "Can I leave a message for Dustin? Would you tell her that Jane Brown from BIS Tech called and I'll call back?"}, {"speaker": "B", "line": "Let me repeat your message to see if I've got it all."}, {"speaker": "A", "line": "This is Mike returning your call. I've just checked my voicemail and got your message."}, {"speaker": "讲解", "line": "Landmark, crossroads, intersection, direction, turn left, go straight ahead, get lost."}, {"speaker": "B", "line": "I'm calling to give you directions to my company. Are you at the train station now?"}, {"speaker": "B", "line": "Go straight ahead for about 500 meters. At the next intersection turn right, then take the first turning on the left."}, {"speaker": "B", "line": "Once you see the post office, turn right. Let me know if you need any clarification."}]}, {"id": "part2.chapter3", "title": "询盘·报价·价格谈判·折扣与佣金 Inquiry, Offer, Negotiation, Discount & Commission", "scene": "外贸价格博弈：买方询盘索样、卖方发盘报价、双方还盘议价，并就批量折扣与代理佣金展开谈判。", "words": [{"en": "inquiry", "pos": "n.", "cn": "询盘"}, {"en": "quotation / quote", "pos": "n.", "cn": "报价"}, {"en": "firm offer", "pos": "n.", "cn": "实盘"}, {"en": "counter offer", "pos": "n.", "cn": "还盘"}, {"en": "FOB / CIF", "pos": "n.", "cn": "离岸价/到岸价"}, {"en": "unit price", "pos": "n.", "cn": "单价"}, {"en": "prohibitive", "pos": "adj.", "cn": "(价格)高得令人却步的"}, {"en": "concession", "pos": "n.", "cn": "让步"}, {"en": "bottom line", "pos": "n.", "cn": "底线"}, {"en": "discount", "pos": "n./v.", "cn": "折扣"}, {"en": "volume / bulk discount", "pos": "n.", "cn": "批量折扣"}, {"en": "commission", "pos": "n.", "cn": "佣金"}, {"en": "commission rate", "pos": "n.", "cn": "佣金率"}, {"en": "profit margin", "pos": "n.", "cn": "利润率"}, {"en": "rock bottom", "pos": "adj.", "cn": "最低的"}], "sentences": [{"en": "Could you send us a detailed quotation, including the specifications, price and payment terms?", "cn": "能否寄给我们一份详细报价，含规格、价格和付款条件？"}, {"en": "Our offer is 300 RMB per case FOB Tianjin, and remains open for three days.", "cn": "我方报价为每箱300元人民币FOB天津，此报盘有效期三天。"}, {"en": "Your price is prohibitive; we can hardly make a counter offer.", "cn": "你方价格高得令人却步，我们几乎无法还盘。"}, {"en": "I'm afraid I have to call the deal off if you can't make any concessions.", "cn": "如果贵方不能让步，恐怕我只好取消这笔交易。"}, {"en": "We are willing to make concessions to secure a long-term business relationship.", "cn": "为了建立长期业务关系，我方愿意做出让步。"}, {"en": "We have reached our bottom line on pricing and cannot go any lower.", "cn": "我们已到价格底线，无法再降。"}, {"en": "Can we get a volume discount on 500 sets?", "cn": "订购500套能拿到批量折扣吗？"}, {"en": "A 4% commission is the maximum; the 3% commission is the best we can grant.", "cn": "4%佣金是上限；3%是我们能给的最高佣金。"}], "dialogue": [{"speaker": "讲解", "line": "Inquiry, quotation, firm offer, non-firm offer, product catalog, request for quotation, trade reference."}, {"speaker": "A", "line": "Are the prices you quoted negotiable? We are considering placing a large order and would like to negotiate the price."}, {"speaker": "B", "line": "As soon as the price picks up, inquiries will revive. Here is our CIF quotation sheet."}, {"speaker": "B", "line": "Our offer is 300 RMB per case FOB Tianjin. This offer will remain open for three days."}, {"speaker": "A", "line": "Your price is prohibitive. $200 per piece is still too high for our company."}, {"speaker": "A", "line": "Is it possible for you to make a better offer? If you can't make any concessions, I'm afraid I have to call the deal off."}, {"speaker": "B", "line": "Our prices are competitive and reflect the quality of our products. We are open to negotiation to reach a mutually beneficial agreement."}, {"speaker": "B", "line": "If you commit to a larger order, we may offer an incremental discount. Our final offer includes a 10% discount."}, {"speaker": "A", "line": "Could you increase the discount to 5%? What kind of discount can you give me on 500 sets?"}, {"speaker": "B", "line": "We usually don't grant any discount for a small quantity. But we can offer a volume discount for bulk orders."}, {"speaker": "A", "line": "What's your usual commission rate for your agents? A 3% commission is too low for us; how about 6%?"}, {"speaker": "B", "line": "A 4% commission is the maximum. The 3% commission is the best we can grant."}]}, {"id": "part2.chapter4", "title": "运输·包装·保险·支付·合同管理 Shipping, Packaging, Insurance, Payment & Contract", "scene": "外贸履约全链条：安排运输方式、确认包装规范、投保货运险、商定付款方式，以及审核与执行合同。", "words": [{"en": "carrier / forwarder", "pos": "n.", "cn": "承运人/货运代理"}, {"en": "freight", "pos": "n.", "cn": "运费；货运"}, {"en": "bill of lading", "pos": "n.", "cn": "提单"}, {"en": "multimodal transport", "pos": "n.", "cn": "多式联运"}, {"en": "corrugated carton", "pos": "n.", "cn": "瓦楞纸箱"}, {"en": "shipping mark", "pos": "n.", "cn": "装运唛头"}, {"en": "insurer / underwriter", "pos": "n.", "cn": "保险人/承保人"}, {"en": "premium", "pos": "n.", "cn": "保险费"}, {"en": "all risks", "pos": "n.", "cn": "一切险"}, {"en": "marine insurance", "pos": "n.", "cn": "海运保险"}, {"en": "payment in advance", "pos": "n.", "cn": "预付款"}, {"en": "deposit", "pos": "n.", "cn": "定金"}, {"en": "installment", "pos": "n.", "cn": "分期付款"}, {"en": "force majeure", "pos": "n.", "cn": "不可抗力"}, {"en": "breach of contract", "pos": "n.", "cn": "违约"}], "sentences": [{"en": "What mode of transportation do you prefer for shipping the goods?", "cn": "这批货您希望用哪种运输方式？"}, {"en": "What is the estimated delivery time for sea freight? Can you expedite the shipment?", "cn": "海运预计多久到货？能否加快装运？"}, {"en": "We usually use corrugated cardboard boxes, with bubble wrap and foam inserts for protection.", "cn": "我们通常用瓦楞纸箱，并加气泡膜和泡沫内衬保护货物。"}, {"en": "We need to consider marine insurance for international shipments.", "cn": "国际运输我们需要考虑投保海运险。"}, {"en": "Do you have insurance that covers theft and damage? What is included in all risks?", "cn": "你们有承保盗窃和损坏的险种吗？一切险包括哪些？"}, {"en": "We typically offer 30% deposit with the balance due before shipment.", "cn": "我们通常收30%定金，余款在发货前付清。"}, {"en": "We require full payment in advance for new customers.", "cn": "对新客户我们要求全额预付。"}, {"en": "Let's go over the contract terms together; we would like two signed copies plus a digital one.", "cn": "我们一起过一遍合同条款；我们需要两份签署原件加一份电子版存档。"}], "dialogue": [{"speaker": "讲解", "line": "Delivery, consign, carrier, forwarder, freight, cargo, waybill, bill of lading, containerization, multimodal transport."}, {"speaker": "A", "line": "What mode of transportation do you prefer? How much will it cost to ship the goods by air?"}, {"speaker": "B", "line": "There is a discount for bulk shipments. Sea freight takes longer but costs less."}, {"speaker": "A", "line": "There seems to be a delay with the shipment. Could you look into it? Please confirm the port of loading and destination."}, {"speaker": "讲解", "line": "Crate, carton, cardboard, drum, foam, bubble wrap, wooden case, neutral packing, shipping mark."}, {"speaker": "A", "line": "What is your preferred packaging method? Do you have any specific design requirements for the packaging?"}, {"speaker": "B", "line": "We usually use corrugated cardboard boxes, and use bubble wrap and foam inserts for added protection. We can also customize the packaging to match your branding."}, {"speaker": "讲解", "line": "Insurer, underwriter, insured, coverage, premium, all risks, marine insurance, total loss, partial loss."}, {"speaker": "A", "line": "Can you recommend a reliable insurance provider? What type of insurance do you recommend for this shipment?"}, {"speaker": "B", "line": "We need marine insurance for international shipments. We can ensure the policy covers all potential transit risks, including theft and damage."}, {"speaker": "A", "line": "How much will the insurance cost? Is the insurance fee included in the total cost?"}, {"speaker": "讲解", "line": "Cash payment, prepaid, endorsement, remit, payment in advance, payment by installment, cash against bill of lading."}, {"speaker": "A", "line": "What payment terms do you require? In which currency would you like to be paid?"}, {"speaker": "B", "line": "We typically offer 30% deposit with the balance due before shipment, and require full payment in advance for new customers."}, {"speaker": "A", "line": "We can accept USD, EUR and GBP. We prefer bank transfer. Do you accept Paypal or credit card?"}, {"speaker": "讲解", "line": "Amend, breach, cancel, conclude, execute, renew, terminate a contract; force majeure; purchase and sales contract."}, {"speaker": "A", "line": "Let's go over the contract terms. Could you clarify the delivery dates, payment terms, quantity, quality and specifications?"}, {"speaker": "B", "line": "We would like to propose some amendments before signing. We'd like two signed copies and a digital copy for our records."}]}, {"id": "part2.chapter5", "title": "商品检验·投诉·争议解决·索赔 Commodity Inspection, Complaints, Disputes & Claims", "scene": "售后纠纷处理：货到商检、就质量/短装/破损提出投诉、协商争议解决，以及正式提出索赔与理赔。", "words": [{"en": "commodity inspection", "pos": "n.", "cn": "商品检验"}, {"en": "inspector", "pos": "n.", "cn": "检验员"}, {"en": "certificate of quality", "pos": "n.", "cn": "品质证书"}, {"en": "complaint", "pos": "n.", "cn": "投诉"}, {"en": "defect / defective", "pos": "n./adj.", "cn": "缺陷/有缺陷的"}, {"en": "shortage", "pos": "n.", "cn": "短量，短缺"}, {"en": "non-conforming", "pos": "adj.", "cn": "不符的，不合格的"}, {"en": "arbitration", "pos": "n.", "cn": "仲裁"}, {"en": "mediation / conciliation", "pos": "n.", "cn": "调解"}, {"en": "claim", "pos": "n./v.", "cn": "索赔"}, {"en": "compensation / indemnity", "pos": "n.", "cn": "赔偿"}, {"en": "refund", "pos": "n./v.", "cn": "退款"}, {"en": "replacement", "pos": "n.", "cn": "换货"}, {"en": "amicable settlement", "pos": "n.", "cn": "友好解决"}, {"en": "lodging a claim", "pos": "phr.", "cn": "提出索赔"}], "sentences": [{"en": "As an integral part of the contract, the inspection of goods has its special importance.", "cn": "作为合同不可分割的一部分，商品检验有其特殊重要性。"}, {"en": "We'll accept the goods only if the results from the two inspections are identical with each other.", "cn": "只有两次检验结果一致时，我们才接受货物。"}, {"en": "The goods received do not meet the specifications outlined in our contract.", "cn": "所收货物不符合合同规定的规格。"}, {"en": "Upon inspection, we found several defects in the merchandise that warrant a complaint.", "cn": "经检验，我们发现商品存在多处缺陷，据此提出投诉。"}, {"en": "We apologize for the inconvenience caused by the delay in delivery.", "cn": "对于交货延误造成的不便，我们深表歉意。"}, {"en": "We are committed to finding an amicable solution in the best interest of both parties.", "cn": "我们致力于寻求符合双方利益的友好解决办法。"}, {"en": "We are now lodging a claim with you for the shortage of goods.", "cn": "我们现就货物短量向你方提出索赔。"}, {"en": "Please examine the matter and send us the goods to meet the shortage as soon as possible.", "cn": "请核查此事，并尽快补发货物以补足短量。"}], "dialogue": [{"speaker": "讲解", "line": "Consignee, consigner, inspection, inspector, certificate of quality, certificate of origin, certificate of quantity, third party."}, {"speaker": "A", "line": "Shall we take up the question of inspection today? As an integral part of the contract, the inspection of goods has its special importance."}, {"speaker": "B", "line": "The exporters have the right to inspect the export goods before delivery to the shipping line."}, {"speaker": "A", "line": "The inspection should be completed within a month after the arrival of the goods. We'll accept the goods only if the results from the two inspections are identical."}, {"speaker": "讲解", "line": "Complaint, defect, shortage, inconsistency, breakage, rust, leak, malfunction, non-conforming, inferior goods."}, {"speaker": "A", "line": "We regret to inform you that the goods received do not meet the specifications in our contract. The goods delivered do not match the sample we approved."}, {"speaker": "A", "line": "The inspection report clearly indicates the goods are defective. We expect a prompt response and resolution."}, {"speaker": "B", "line": "We understand your concern and will take corrective action immediately."}, {"speaker": "讲解", "line": "Arbitration, mediation, conciliation, neutral, breach of contract, compensation claim, corrective action, dispute resolution."}, {"speaker": "B", "line": "We apologize for the inconvenience caused by the delay in delivery. Could we discuss risk mitigation measures to protect both parties?"}, {"speaker": "B", "line": "We are committed to finding an amicable solution. We are open to renegotiating the terms of the contract."}, {"speaker": "讲解", "line": "Claim, claimant, compensation, indemnify, refund, replacement, amicable settlement, file a claim, counterclaim."}, {"speaker": "A", "line": "We are now lodging a claim with you for the shortage of goods. Please give our claim your favorable consideration."}, {"speaker": "A", "line": "We request you to indemnify us for a loss of $10,000 due to the inferior quality of your goods."}, {"speaker": "B", "line": "We heard you have lodged a claim for the defective products. We will replace all defective products and compensate for your losses."}, {"speaker": "A", "line": "Please examine the matter and send us the goods to meet the shortage as soon as possible."}]}]}, {"part": 3, "theme": "行业品类词汇与口语对练", "chapters": [{"id": "part3.chapter1", "title": "一带一路倡议与基建/清洁能源/AI/数字合作 Belt & Road Initiative: Infrastructure, Clean Energy, AI & Digital Collaboration", "scene": "围绕一带一路倡议(BRI)核心术语，系统串讲基础设施、铁路网、清洁能源、人工智能与数字合作六大外贸行业板块的核心词汇与商务例句。", "words": [{"en": "Belt and Road Initiative", "pos": "n.", "cn": "一带一路倡议"}, {"en": "economic corridor", "pos": "n.", "cn": "经济走廊"}, {"en": "infrastructure connectivity", "pos": "n.", "cn": "基础设施互联互通"}, {"en": "win-win cooperation", "pos": "n.", "cn": "互利共赢合作"}, {"en": "intermodal transport", "pos": "n.", "cn": "多式联运"}, {"en": "cross-border railway", "pos": "n.", "cn": "跨境铁路"}, {"en": "rail connectivity", "pos": "n.", "cn": "铁路互联互通"}, {"en": "renewable energy", "pos": "n.", "cn": "可再生能源"}, {"en": "carbon neutral", "pos": "adj.", "cn": "碳中和的"}, {"en": "clean energy", "pos": "n.", "cn": "清洁能源"}, {"en": "deep learning", "pos": "n.", "cn": "深度学习"}, {"en": "autonomous vehicle", "pos": "n.", "cn": "自动驾驶汽车"}, {"en": "digital collaboration", "pos": "n.", "cn": "数字协作"}, {"en": "digital economy", "pos": "n.", "cn": "数字经济"}, {"en": "interoperability", "pos": "n.", "cn": "互操作性/互通"}], "sentences": [{"en": "The BRI has led to significant investments in infrastructure and development projects globally.", "cn": "一带一路倡议带动了全球范围内基础设施与发展项目的大量投资。"}, {"en": "Sustainability is a key principle guiding the development of BRI projects.", "cn": "可持续性是指导一带一路项目发展的关键原则。"}, {"en": "Infrastructure development is a cornerstone of the BRI, focusing on roads, railways and ports.", "cn": "基础设施建设是一带一路的基石，重点覆盖公路、铁路和港口。"}, {"en": "Cross-border railways such as the China-Laos Railway are emblematic projects connecting different countries and regions.", "cn": "中老铁路等跨境铁路是连接不同国家和地区的标志性项目。"}, {"en": "The share of clean energy in China's energy mix has been increasing steadily over the years.", "cn": "多年来，清洁能源在中国能源结构中的占比稳步上升。"}, {"en": "Deep learning has enabled significant progress in image recognition and speech recognition.", "cn": "深度学习推动了图像识别与语音识别领域的重大进展。"}, {"en": "The integration of the digital economy and the real economy is crucial for tapping into the full potential of digital technology.", "cn": "推动数字经济与实体经济深度融合，是充分释放数字技术潜力的关键。"}], "dialogue": [{"speaker": "讲解", "line": "Chapter 1, Unit 1: Belt, Initiative, Corridor, Openness, Inclusiveness, Cooperation, Investment, Trade, Development."}, {"speaker": "讲解", "line": "The BRI adheres to openness, inclusiveness and mutual benefit, aiming at long-term common development among participating parties."}, {"speaker": "讲解", "line": "Unit 2: Infrastructure construction covers railway, highway, port, bridge, tunnel, airport, optical fiber, satellite and power plant."}, {"speaker": "讲解", "line": "Infrastructure development is a cornerstone of the BRI, focusing on roads, railways and ports."}, {"speaker": "讲解", "line": "Unit 3: high-speed train, intercity carriage, freight train, cross-border railway, light rail, subway."}, {"speaker": "讲解", "line": "The construction of the railway is a key component of the BRI, facilitating trade and cultural exchanges between nations."}, {"speaker": "讲解", "line": "Unit 4: solar energy, nuclear energy, biodiesel, wind farm, hydro, renewable energy, zero emission, carbon neutral."}, {"speaker": "讲解", "line": "Governments and enterprises find clean energy cost-effective due to its long-term benefits."}, {"speaker": "讲解", "line": "Unit 5: Artificial Intelligence, Machine Learning, Deep Learning, Neural Network, NLP, robotics, speech recognition."}, {"speaker": "讲解", "line": "The development of AI has raised ethical concerns about the potential impact on jobs, privacy and security."}, {"speaker": "讲解", "line": "Unit 6: collaboration, digitalization, cyber security, e-commerce, digital identity, digital infrastructure, interoperability."}, {"speaker": "讲解", "line": "We emphasize digital collaboration to ensure efficient project delivery for all BRI related work."}]}, {"id": "part3.chapter2", "title": "文化传媒/出版/影视/网络社交/游戏/直播电商 Media & Entertainment: Culture, Publishing, TV, Cyberspace, Gaming, Livestream", "scene": "覆盖文化多元、大众传媒、出版业、电视娱乐、网络社交、电子游戏与直播电商七大文化传媒板块的词汇与口语例句对练。", "words": [{"en": "cultural diversity", "pos": "n.", "cn": "文化多样性"}, {"en": "cultural heritage", "pos": "n.", "cn": "文化遗产"}, {"en": "mass media", "pos": "n.", "cn": "大众传媒"}, {"en": "public service announcement", "pos": "n.", "cn": "公益公告"}, {"en": "publishing house", "pos": "n.", "cn": "出版社"}, {"en": "copyright royalty", "pos": "n.", "cn": "版权版税"}, {"en": "periodical", "pos": "n.", "cn": "期刊"}, {"en": "audience rating", "pos": "n.", "cn": "收视率"}, {"en": "reality TV", "pos": "n.", "cn": "真人秀"}, {"en": "network neutrality", "pos": "n.", "cn": "网络中立"}, {"en": "click rate", "pos": "n.", "cn": "点击率"}, {"en": "role-playing game", "pos": "n.", "cn": "角色扮演游戏"}, {"en": "cross-platform play", "pos": "n.", "cn": "跨平台联机"}, {"en": "live commerce", "pos": "n.", "cn": "直播电商"}, {"en": "bullet screen", "pos": "n.", "cn": "弹幕"}], "sentences": [{"en": "The rich culture of China is reflected in its ancient traditions and modern innovations.", "cn": "中国丰富的文化体现在古老传统与现代创新之中。"}, {"en": "The mass media plays a crucial role in shaping public opinion and disseminating information.", "cn": "大众传媒在塑造舆论和传播信息方面发挥着关键作用。"}, {"en": "The publisher decided to publish the renowned author's latest novel, which has already gained significant attention.", "cn": "出版社决定出版这位知名作家的最新小说，该书已备受关注。"}, {"en": "Reality TV shows have become a staple of modern entertainment, offering a glimpse into the lives of ordinary people.", "cn": "真人秀已成为现代娱乐的主流，让观众窥见普通人的生活。"}, {"en": "Advocates for network neutrality argue that it ensures a level playing field for all users and content providers.", "cn": "网络中立的倡导者认为，它为所有用户和内容提供商确保了公平竞争环境。"}, {"en": "The gameplay in this role-playing game is immersive, allowing players to fully engage in the game world.", "cn": "这款角色扮演游戏的玩法沉浸感强，让玩家完全融入游戏世界。"}, {"en": "The shopping cart feature on live streams allows viewers to purchase products directly through the platform.", "cn": "直播中的购物车功能让观众可直接通过平台购买商品。"}, {"en": "Comments from viewers can provide valuable feedback and help guide the direction of a live stream.", "cn": "观众的评论能提供宝贵反馈，帮助主播及时调整直播方向。"}], "dialogue": [{"speaker": "讲解", "line": "Chapter 2, Unit 1: Civilization, Culture, Multicultural, Diversity, Cradle, Folk, Indigenous, Cultural heritage."}, {"speaker": "讲解", "line": "A multicultural environment is conducive to cultural exchange and mutual understanding."}, {"speaker": "讲解", "line": "Unit 2: digital media, broadcast, press conference, fake news, public service announcement, social media site."}, {"speaker": "讲解", "line": "Mainstream media outlets are responsible for providing accurate and unbiased news to the public."}, {"speaker": "讲解", "line": "Unit 3: publisher, periodical, quarterly, editorial, editor-in-chief, copyright, circulation, proofread."}, {"speaker": "讲解", "line": "The press is planning to release a special edition of the classic novel to celebrate its 50th anniversary."}, {"speaker": "讲解", "line": "Unit 4: comedy, drama, animation, soap opera, talent show, talk show, sitcom, audience rating."}, {"speaker": "讲解", "line": "The soap opera has been a long-running staple of daytime television with its dramatic storylines and cliffhangers."}, {"speaker": "讲解", "line": "Unit 5: cyberspace, database, click rate, follower, friend circle, network security, network neutrality."}, {"speaker": "讲解", "line": "Web chats and instant messaging apps like WeChat facilitate real-time communication over the network."}, {"speaker": "讲解", "line": "Unit 6: video game genre, gameplay, multiplayer, character, level, patch, cross platform, virtual reality."}, {"speaker": "讲解", "line": "Regular patches are released by the developers to fix bugs and improve the game experience."}, {"speaker": "讲解", "line": "Unit 7: livestreamer, webcast, host, viewer, gift, shopping cart, chat room, bullet screen, live commerce."}, {"speaker": "讲解", "line": "During live streams, viewers can send gifts to support their favorite live streamers, and emojis are used in the chat room."}]}, {"id": "part3.chapter3", "title": "汽车/五金工具/机械设备/材料加工/燃料/资源勘探 Automotive, Hardware, Machinery, Material Processing, Fuel & Resource Exploration", "scene": "汽车零部件与车型、五金工具、机械设备、材料加工工艺、燃料种类与资源勘探六大工业制造板块的外贸词汇与例句。", "words": [{"en": "accelerator", "pos": "n.", "cn": "油门/加速器"}, {"en": "clutch", "pos": "n.", "cn": "离合器"}, {"en": "chassis", "pos": "n.", "cn": "底盘"}, {"en": "new energy vehicle", "pos": "n.", "cn": "新能源汽车"}, {"en": "hybrid electric vehicle", "pos": "n.", "cn": "混合动力汽车"}, {"en": "screwdriver", "pos": "n.", "cn": "螺丝刀"}, {"en": "wrench/spanner", "pos": "n.", "cn": "扳手"}, {"en": "fastener", "pos": "n.", "cn": "紧固件"}, {"en": "crane", "pos": "n.", "cn": "起重机"}, {"en": "lathe", "pos": "n.", "cn": "车床"}, {"en": "welding machine", "pos": "n.", "cn": "焊接机"}, {"en": "smelt", "pos": "v.", "cn": "熔炼"}, {"en": "alloy", "pos": "n.", "cn": "合金"}, {"en": "crude oil", "pos": "n.", "cn": "原油"}, {"en": "offshore drilling", "pos": "n.", "cn": "海上钻探"}], "sentences": [{"en": "We specialize in manufacturing high-quality automotive parts, including engines, transmissions and suspension systems.", "cn": "我们专业生产高品质汽车零部件，包括发动机、变速箱和悬挂系统。"}, {"en": "The new energy vehicle is an inevitable choice for low-carbon economy, which shows the auto industry trend.", "cn": "新能源汽车是低碳经济的必然选择，代表着汽车工业的发展趋势。"}, {"en": "We are a leading exporter of a wide variety of hardware and general merchandise.", "cn": "我们是种类齐全的五金及日用杂货的主要出口商。"}, {"en": "Mechanical equipment plays a crucial role in improving efficiency and reducing costs.", "cn": "机械设备在提高效率、降低成本方面发挥着关键作用。"}, {"en": "Safety comes first in the operation of machinery and equipment.", "cn": "机械设备操作中，安全第一。"}, {"en": "The process of refining crude oil is complex and requires advanced technology.", "cn": "原油提炼工艺复杂，需要先进技术。"}, {"en": "Gasoline is highly flammable and should be stored in approved containers.", "cn": "汽油高度易燃，必须存放在经认可的容器中。"}, {"en": "Our team specializes in seismic data analysis to assess the feasibility of drilling operations.", "cn": "我们团队专攻地震数据分析，以评估钻探作业的可行性。"}], "dialogue": [{"speaker": "讲解", "line": "Chapter 3, Unit 1: starter, accelerator, clutch, brake, handbrake, gear lever, seat belt, steering wheel, dashboard, chassis, tire."}, {"speaker": "讲解", "line": "Our company offers a wide range of automotive components that meet international standards for safety and performance."}, {"speaker": "讲解", "line": "Unit 2: electric vehicle, hybrid SUV, pickup truck, lorry, recreational vehicle, tanker, new energy vehicle."}, {"speaker": "讲解", "line": "Hybrid electric vehicle is an energy-saving and environment-friendly vehicle driven by both diesel and electric engines."}, {"speaker": "讲解", "line": "Unit 3: screwdriver, bolt, nut, spanner, wrench, pliers, hammer, saw, grinder, flange, punch."}, {"speaker": "讲解", "line": "We are committed to providing durable and reliable hardware products to our customers."}, {"speaker": "讲解", "line": "Unit 4: crane, hoist, lathe, planer, robot, machine tool, harvester, transformer, turbine, welding machine."}, {"speaker": "讲解", "line": "Strict safety measures should be taken to ensure the safe operation of machinery and equipment."}, {"speaker": "讲解", "line": "Unit 5: embed, emboss, perforate, lubricate, silica gel, alloy, weld, smelt, mosaic, refine."}, {"speaker": "讲解", "line": "Regular lubrication is essential to prevent wear and tear in machinery."}, {"speaker": "讲解", "line": "Unit 6: solid fuel, fossil fuel, natural gas, crude oil, diesel, gasoline, unleaded, flammable, octane, ethanol."}, {"speaker": "讲解", "line": "Ethanol-blended gasoline is becoming more popular as an alternative to traditional fossil fuels."}, {"speaker": "讲解", "line": "Unit 7: drill, mine, exploit, extraction, offshore, non-renewable, refinery, pipeline, spill, exploration license."}, {"speaker": "讲解", "line": "We are working closely with local communities to ensure that our exploration activities are sustainable."}]}, {"id": "part3.chapter4", "title": "银行信贷/抵押担保/宏观经济/金融风险/证券投融资/企业并购 Banking, Loans, Mortgage, Macro, Securities & M&A", "scene": "金融外贸八大模块：银行存贷与电子银行、贷款透支、抵押担保、通胀周期、外汇风险、证券组合、投融资与企业并购的专业词汇。", "words": [{"en": "savings account", "pos": "n.", "cn": "储蓄账户"}, {"en": "debit/credit card", "pos": "n.", "cn": "借记/信用卡"}, {"en": "e-banking", "pos": "n.", "cn": "电子银行"}, {"en": "wire transfer", "pos": "n.", "cn": "电汇"}, {"en": "amortization", "pos": "n.", "cn": "分期摊销"}, {"en": "bad loan", "pos": "n.", "cn": "不良贷款"}, {"en": "jumbo loan", "pos": "n.", "cn": "巨额贷款"}, {"en": "collateral", "pos": "n.", "cn": "抵押品"}, {"en": "foreclosure", "pos": "n.", "cn": "取消抵押品赎回权"}, {"en": "inflation", "pos": "n.", "cn": "通货膨胀"}, {"en": "foreign exchange reserve", "pos": "n.", "cn": "外汇储备"}, {"en": "hedge fund", "pos": "n.", "cn": "对冲基金"}, {"en": "angel investor", "pos": "n.", "cn": "天使投资人"}, {"en": "equity finance", "pos": "n.", "cn": "股权融资"}, {"en": "merger/acquisition", "pos": "n.", "cn": "并购"}], "sentences": [{"en": "I need to visit the bank to open a new savings account.", "cn": "我需要去银行开立一个新的储蓄账户。"}, {"en": "As a depositor, you are entitled to withdraw your funds at any time.", "cn": "作为存款人，您有权随时提取资金。"}, {"en": "Many of the largest banks were hit hard by bad loan portfolios and forced to merge or go out of business.", "cn": "许多大银行因不良贷款组合遭受重创，被迫合并或倒闭。"}, {"en": "Any person who plans to act as a guarantor for a mortgage must clarify the legal and financial obligations before signing.", "cn": "任何计划担任抵押担保人的人，在签署前必须厘清相应的法律与财务义务。"}, {"en": "Higher inflation threatens to push interest rates higher.", "cn": "更高的通胀可能推高利率。"}, {"en": "Exchange controls are government-imposed restrictions on private transactions conducted in foreign currency.", "cn": "外汇管制是政府对私人外币交易施加的限制。"}, {"en": "Short-term securities can be part of a diversified investment portfolio.", "cn": "短期证券可作为多元化投资组合的一部分。"}, {"en": "Three companies are currently having difficulty in raising sufficient capital to support their expansion plans.", "cn": "目前有三家公司难以筹集足够资本以支持其扩张计划。"}], "dialogue": [{"speaker": "讲解", "line": "Chapter 4, Unit 1: depositor, saver, debit card, credit card, passbook, ATM, bank statement, e-bank, wire transfer, verification code."}, {"speaker": "讲解", "line": "You can manage your savings and checking accounts through our e-bank platform; electronic payments are quick and convenient."}, {"speaker": "讲解", "line": "Unit 2: loan, overdraft, accrued interest, amortize, non-performing, subprime, bad loan, bridge loan, jumbo loan, consumer loan."}, {"speaker": "讲解", "line": "When an individual takes out a bank loan, the issuing bank will charge corresponding interest on the principal."}, {"speaker": "讲解", "line": "Unit 3: mortgagee, guarantor, collateralize, foreclose, repossession, secured, unsecured, homeowner, balloon mortgage."}, {"speaker": "讲解", "line": "If a borrower loses their house due to default, the proceeds from the sale will first go toward paying off the first mortgage."}, {"speaker": "讲解", "line": "Unit 4: inflation, disinflation, deflation, boom, bubble, slump, crash, hyperinflation, consumer price inflation."}, {"speaker": "讲解", "line": "The core inflation rate fell to its lowest level in March last year, and the market is discussing whether to focus on disinflation."}, {"speaker": "讲解", "line": "Unit 5: high-risk, venture capital, exchange control, exchange rate risk, foreign exchange reserve, risk management."}, {"speaker": "讲解", "line": "Over the past years, the country's foreign exchange reserves have remained relatively stable at a healthy level."}, {"speaker": "讲解", "line": "Unit 6: futures, option, trust fund, pension fund, hedge fund, securities, investment portfolio, stock exchange."}, {"speaker": "讲解", "line": "Price volatility is one of the basic characteristics of mature futures markets; crude oil futures once jumped more than 10 dollars per barrel."}, {"speaker": "讲解", "line": "Unit 7: angel investor, professional investor, retail investor, equity finance, debt finance, project financing, raise capital."}, {"speaker": "讲解", "line": "Financing structure usually refers to the proportional relationship between equity finance and debt finance of a market entity."}, {"speaker": "讲解", "line": "Unit 8: acquisition, merger, consolidation, monopoly, leveraged buyout, horizontal merger, reverse merger."}, {"speaker": "讲解", "line": "Even if the acquisition is successful, it could still be hard to achieve the expected return on the initial investment outlay."}]}, {"id": "part3.chapter5", "title": "物联网/航天/工业自动化/电子化工/生物科技/医疗器械 IoT, Aerospace, Automation, Electronics, Biotech & Healthcare", "scene": "九大高科技行业词汇：物联网与数字孪生、纳米/3D打印前沿科技、航天空间站、工业自动化、电子工程、化学材料、生物技术、医疗器械与临床医疗体系。", "words": [{"en": "Internet of Things (IoT)", "pos": "n.", "cn": "物联网"}, {"en": "cloud computing", "pos": "n.", "cn": "云计算"}, {"en": "digital twin", "pos": "n.", "cn": "数字孪生"}, {"en": "nanotechnology", "pos": "n.", "cn": "纳米技术"}, {"en": "3D printing", "pos": "n.", "cn": "3D打印"}, {"en": "space station", "pos": "n.", "cn": "空间站"}, {"en": "spacewalk", "pos": "n.", "cn": "太空行走"}, {"en": "industrial automation", "pos": "n.", "cn": "工业自动化"}, {"en": "semiconductor", "pos": "n.", "cn": "半导体"}, {"en": "integrated circuit", "pos": "n.", "cn": "集成电路"}, {"en": "titanium", "pos": "n.", "cn": "钛"}, {"en": "bioremediation", "pos": "n.", "cn": "生物修复"}, {"en": "pacemaker", "pos": "n.", "cn": "心脏起搏器"}, {"en": "glucometer", "pos": "n.", "cn": "血糖仪"}, {"en": "hierarchical medical system", "pos": "n.", "cn": "分级医疗体系"}], "sentences": [ const LS_KEY = "bec90_state";
function loadState(){

      wrongWords:s.wrongWords||{}, wrongQuestions:s.wrongQuestions||[],
      acceptance:s.acceptance||{}, wordbook:s.wordbook||[],
      wordStates:s.wordStates||{} }; // en_lower: "new" | "reviewed"
  } catch(e){ return { doneDays:[], remindTime:"20:00", wrongWords:{}, wrongQuestions:[], acceptance:{}, wordStates:{} }; }
